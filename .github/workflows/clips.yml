name: Clips machen

# Laeuft durchgehend alle 30 Minuten von allein (GitHub startet manchmal ein
# paar Minuten spaeter) und jederzeit per Knopf: Actions -> "Clips machen" -> "Run workflow".
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      neu_schneiden:
        description: "Clips neu schneiden (auch schon gemachte, z.B. nach einem Update)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: clips
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r clipper/requirements.txt

      - name: Untertitel-Modell aus dem Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Liste schon gemachter Clips holen
        run: gh release download clip-state -p gesehen.json -p telegram_chat.txt -D clipper/state --clobber || echo "noch keine Liste"

      - name: Clips suchen und schneiden
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          NEU: ${{ inputs.neu_schneiden && '--alles-neu' || '' }}
        run: python clipper/clipper.py $NEU

      - name: Clips als Release ablegen
        run: |
          shopt -s nullglob
          videos=(clipper/ausgabe/*.mp4)
          if [ ${#videos[@]} -eq 0 ]; then echo "Keine neuen Clips."; exit 0; fi
          tag="clips-$(date -u +%Y-%m-%d)"
          notes=clipper/ausgabe/notizen.md
          echo "Zum Posten: Video antippen -> laden -> in Fotos sichern -> in TikTok hochladen. Beschreibung unten kopieren." > "$notes"
          for v in "${videos[@]}"; do
            printf '\n---\n### %s\n```\n%s\n```\n' "$(basename "$v")" "$(cat "${v%.mp4}.txt")" >> "$notes"
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            old=$(gh release view "$tag" --json body -q .body)
            printf '%s\n\n%s\n' "$old" "$(tail -n +2 "$notes")" > "$notes.neu"
            gh release edit "$tag" --notes-file "$notes.neu"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Clips $(date -u +%d.%m.%Y)" --notes-file "$notes"
          fi
          gh release upload "$tag" "${videos[@]}" clipper/ausgabe/*.txt --clobber

      - name: An Telegram schicken (falls eingerichtet)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CLIPS_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CLIPS_TELEGRAM_CHAT_ID }}
        run: python clipper/telegram_senden.py clipper/ausgabe clipper/state/telegram_chat.txt

      - name: Liste speichern
        run: |
          [ -f clipper/state/gesehen.json ] || exit 0
          gh release view clip-state >/dev/null 2>&1 || \
            gh release create clip-state --target "$GITHUB_SHA" --title "Clip-Liste (nicht loeschen)" \
              --notes "Merkt sich, welche Clips schon gemacht wurden." --latest=false
          gh release upload clip-state clipper/state/gesehen.json --clobber
          [ ! -f clipper/state/telegram_chat.txt ] || gh release upload clip-state clipper/state/telegram_chat.txt --clobber
          shopt -s nullglob
          bilder=(clipper/ausgabe/vorschau/*.jpg)
          [ ${#bilder[@]} -eq 0 ] || gh release upload clip-state "${bilder[@]}" --clobber
