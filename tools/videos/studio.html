<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>BENGX Erklaerfilme</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;450;500&display=swap">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="bild" width="1920" height="1080"></canvas>
<script>
/* Jede Zeichnung haengt nur an der Bildnummer, nie an der echten Uhr.
   Nur so kommt bei jedem Lauf dasselbe Bild heraus und die Aufnahme
   kann sich Zeit lassen. */
(function(){
"use strict";
var c = document.getElementById("bild"), g = c.getContext("2d");
var MASS = 1.5;                       /* 1920x1080 aufnehmen, 1280x720 denken */
var W = c.width / MASS, H = c.height / MASS, FPS = 30;

var GOLD = "#EFC45E", GOLD_D = "#B08E36";
var FG = "#DCE1E8", MID = "#A4ABB4", DIM = "#7D848D";
var GRUEN = "#55D6A6", ROT = "#FF8E7E", LINIE = "rgba(255,255,255,.12)";
var ANZEIGE = '700 {s}px Archivo, Arial, sans-serif';
var TEXT = '{s}px Inter, Arial, sans-serif';
var DATEN = '{s}px "IBM Plex Mono", monospace';
function f(v, s){ return v.replace("{s}", s); }

/* ---- kleine Helfer ---- */
function klar(){
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);
  g.scale(MASS, MASS);
}
function sanft(t){ return t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3); }
function fenster(bild, von, bis, blende){
  blende = blende || 26;
  return Math.max(0, Math.min(
    sanft(spanne(bild, von, von + blende)),
    1 - sanft(spanne(bild, bis - blende, bis))));
}
function spanne(bild, von, bis){
  if (bild <= von) return 0;
  if (bild >= bis) return 1;
  return (bild - von) / (bis - von);
}
function schrift(txt, x, y, stil, farbe, ausrichtung, deckung){
  g.save();
  g.globalAlpha = deckung === undefined ? 1 : deckung;
  g.font = stil; g.fillStyle = farbe;
  g.textAlign = ausrichtung || "left"; g.textBaseline = "alphabetic";
  g.fillText(txt, x, y);
  g.restore();
}
function linie(x1, y1, x2, y2, farbe, breite, deckung){
  g.save();
  g.globalAlpha = deckung === undefined ? 1 : deckung;
  g.strokeStyle = farbe; g.lineWidth = breite || 1;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  g.restore();
}
function kasten(x, y, b, h, r, fuell, rand, deckung){
  g.save();
  g.globalAlpha = deckung === undefined ? 1 : deckung;
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, b, h, r);
  else g.rect(x, y, b, h);
  if (fuell){ g.fillStyle = fuell; g.fill(); }
  if (rand){ g.strokeStyle = rand; g.lineWidth = 1; g.stroke(); }
  g.restore();
}
/* Kopfzeile: Marke links, Kapitel rechts — in jedem Film gleich. */
function rahmen(kapitel, nummer){
  g.save();
  g.globalAlpha = .9;
  schrift("BENGX", 64, 64, f(DATEN, 15), FG);
  g.restore();
  schrift(nummer + " — " + kapitel, W - 64, 64, f(DATEN, 13), DIM, "right");
  linie(64, 86, W - 64, 86, LINIE, 1);
  linie(64, H - 70, W - 64, H - 70, LINIE, 1);
  schrift("Keine Anlageberatung", 64, H - 44, f(DATEN, 12), DIM);
}
/* Titelkarte am Anfang jedes Films */
function titel(bild, gross, klein, bis){
  var ein = sanft(spanne(bild, 0, 18));
  var aus = 1 - sanft(spanne(bild, bis - 14, bis));
  var a = Math.min(ein, aus);
  if (a <= 0) return false;
  var y = H / 2 - 10 + (1 - ein) * 18;
  schrift(gross, W / 2, y, f(ANZEIGE, 62), FG, "center", a);
  schrift(klein, W / 2, y + 44, f(TEXT, 21), MID, "center", a * .92);
  linie(W / 2 - 40, y + 72, W / 2 + 40, y + 72, GOLD, 2, a);
  return true;
}
function abspann(bild, von, text){
  var a = sanft(spanne(bild, von, von + 20));
  if (a <= 0) return;
  g.save(); g.globalAlpha = a * .96;
  g.fillStyle = "rgba(0,0,0,.82)"; g.fillRect(0, 0, W, H);
  g.restore();
  schrift(text, W / 2, H / 2 + 8, f(ANZEIGE, 34), FG, "center", a);
}

/* ================= Kerzen, gemeinsam genutzt ================= */
var KURSE = [
  [100,106,98,104],[104,110,102,108],[108,112,104,106],[106,109,101,102],
  [102,105,97,99],[99,104,97,103],[103,111,102,110],[110,116,108,114],
  [114,118,110,112],[112,115,106,108],[108,113,106,112],[112,120,111,118],
  [118,124,116,122],[122,126,118,120],[120,123,115,117],[117,122,115,121]
];
function kerze(x, b, o, h, l, s, skala, deckung){
  var hoch = skala(h), tief = skala(l), auf = skala(o), zu = skala(s);
  var farbe = s >= o ? GRUEN : ROT;
  g.save();
  g.globalAlpha = deckung === undefined ? 1 : deckung;
  g.strokeStyle = farbe; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(x + b / 2, hoch); g.lineTo(x + b / 2, tief); g.stroke();
  var y = Math.min(auf, zu), hh = Math.max(2, Math.abs(zu - auf));
  g.fillStyle = farbe; g.globalAlpha = (deckung === undefined ? 1 : deckung) * .9;
  g.fillRect(x, y, b, hh);
  g.restore();
}

/* ---- Chart: Kerzen zeichnen, Zonen legen, beschriften ---- */
function chart(kurse, o){
  o = o || {};
  var l = o.l || 110, r = o.r || (W - 110), ob = o.o || 150, u = o.u || (H - 150);
  var alle = [];
  for (var i = 0; i < kurse.length; i++){ alle.push(kurse[i][1], kurse[i][2]); }
  var min = o.min != null ? o.min : Math.min.apply(null, alle);
  var max = o.max != null ? o.max : Math.max.apply(null, alle);
  var luft = (max - min) * 0.12;
  min -= luft; max += luft;
  var breite = (r - l) / kurse.length;
  return {
    kurse: kurse,
    l: l, r: r, o: ob, u: u, breite: breite, min: min, max: max,
    y: function(p){ return u - (p - min) / (max - min) * (u - ob); },
    x: function(i){ return l + i * breite + breite / 2; },
    links: function(i){ return l + i * breite + breite * 0.17; },
    kerzenbreite: breite * 0.66,
    /* Zeichnet bis Kerze n, die letzte waechst noch heran. */
    bis: function(n, deckung){
      var ganz = Math.floor(n);
      for (var i = 0; i < Math.min(ganz, kurse.length); i++){
        var k = kurse[i];
        kerze(this.links(i), this.kerzenbreite, k[0], k[1], k[2], k[3], this.y,
              deckung === undefined ? 1 : deckung);
      }
      if (ganz < kurse.length && n > ganz){
        var t = n - ganz, k2 = kurse[ganz];
        kerze(this.links(ganz), this.kerzenbreite, k2[0],
              k2[0] + (k2[1] - k2[0]) * t, k2[0] + (k2[2] - k2[0]) * t,
              k2[0] + (k2[3] - k2[0]) * t, this.y,
              (deckung === undefined ? 1 : deckung));
      }
    }
  };
}
/* Text mit dunkler Unterlage — sonst verschluckt ihn die Kerze dahinter. */
function schildchen(text, x, y, stil, farbe, t){
  if (t <= 0) return;
  g.save();
  g.font = stil;
  var b = g.measureText(text).width;
  g.globalAlpha = t * 0.92;
  g.fillStyle = "#000";
  if (g.roundRect){ g.beginPath(); g.roundRect(x - 5, y - 14, b + 10, 20, 4); g.fill(); }
  else g.fillRect(x - 5, y - 14, b + 10, 20);
  g.restore();
  schrift(text, x, y, stil, farbe, "left", t);
}

/* Waagerechte Marke mit Beschriftung, zieht sich von links auf. */
function pegel(ch, preis, text, farbe, t, gestrichelt){
  if (t <= 0) return;
  var y = ch.y(preis);
  g.save();
  g.globalAlpha = t; g.strokeStyle = farbe; g.lineWidth = 1.4;
  if (gestrichelt) g.setLineDash([6, 5]);
  g.beginPath(); g.moveTo(ch.l, y); g.lineTo(ch.l + (ch.r - ch.l) * t, y); g.stroke();
  g.restore();
  if (text) schildchen(text, ch.l + 4, y - 9, f(DATEN, 14), farbe, t);
}
/* Rechteckige Zone (FVG, Order Block, Supply/Demand). */
function zone(ch, vonI, bisI, oben, unten, farbe, randfarbe, t, text){
  if (t <= 0) return;
  var x1 = ch.links(vonI), x2 = ch.links(bisI) + ch.kerzenbreite;
  var y1 = ch.y(oben), y2 = ch.y(unten);
  var b = (x2 - x1) * t;
  g.save();
  g.globalAlpha = t * 0.9;
  g.fillStyle = farbe; g.fillRect(x1, y1, b, y2 - y1);
  if (randfarbe){ g.strokeStyle = randfarbe; g.lineWidth = 1; g.strokeRect(x1, y1, b, y2 - y1); }
  g.restore();
  if (text && t > 0.6) schildchen(text, x1 + 8, y1 - 10, f(DATEN, 14), randfarbe || farbe, (t - 0.6) / 0.4);
}
/* Kurzer Pfeil mit Spitze. */
function pfeil(x1, y1, x2, y2, farbe, t){
  if (t <= 0) return;
  var xx = x1 + (x2 - x1) * t, yy = y1 + (y2 - y1) * t;
  g.save();
  g.globalAlpha = t; g.strokeStyle = farbe; g.lineWidth = 2;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(xx, yy); g.stroke();
  var w = Math.atan2(yy - y1, xx - x1);
  g.beginPath(); g.moveTo(xx, yy);
  g.lineTo(xx - 10 * Math.cos(w - 0.4), yy - 10 * Math.sin(w - 0.4));
  g.lineTo(xx - 10 * Math.cos(w + 0.4), yy - 10 * Math.sin(w + 0.4));
  g.closePath(); g.fillStyle = farbe; g.fill();
  g.restore();
}
/* Hebt eine Kerze hervor: zarter Schleier dahinter, Kerze darueber neu. */
function leuchte(ch, i, farbe, t){
  if (t <= 0) return;
  var x = ch.links(i) - 7, b = ch.kerzenbreite + 14;
  g.save();
  g.globalAlpha = t * 0.15;
  g.fillStyle = farbe;
  g.fillRect(x, ch.o - 12, b, ch.u - ch.o + 24);
  g.restore();
  g.save();
  g.globalAlpha = t * 0.5; g.strokeStyle = farbe; g.lineWidth = 1;
  g.strokeRect(x, ch.o - 12, b, ch.u - ch.o + 24);
  g.restore();
  var k = ch.kurse && ch.kurse[i];
  if (k) kerze(ch.links(i), ch.kerzenbreite, k[0], k[1], k[2], k[3], ch.y, 1);
}

/* Erklaerzeile unten, immer an derselben Stelle. */
function satz(text, t, zweite){
  if (t <= 0) return;
  schrift(text, 110, H - 108 + (zweite ? 30 : 0),
          f(TEXT, zweite ? 18 : 21), zweite ? MID : FG, "left", t);
}

window.__szenen = {};
window.__kerzen = { KURSE: KURSE, kerze: kerze, chart: chart, pegel: pegel, zone: zone, pfeil: pfeil, satz: satz,
  leuchte: leuchte };
window.__werkzeug = {
  klar: klar, sanft: sanft, spanne: spanne, schrift: schrift, linie: linie,
  kasten: kasten, rahmen: rahmen, titel: titel, abspann: abspann,
  schildchen: schildchen,
  fenster: fenster,
  f: f, ANZEIGE: ANZEIGE, TEXT: TEXT, DATEN: DATEN,
  GOLD: GOLD, GOLD_D: GOLD_D, FG: FG, MID: MID, DIM: DIM,
  GRUEN: GRUEN, ROT: ROT, LINIE: LINIE, W: W, H: H, FPS: FPS, g: g
};
window.zeichne = function(bild){
  klar();
  var s = window.__szenen[window.__aktuelle];
  if (s) s(bild);
};
})();
</script>
<script src="szenen.js"></script>
<script src="szenen-markt.js"></script>
</body>
</html>
