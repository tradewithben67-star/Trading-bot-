<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BENGX KI</title>
<style>
:root {
  --bg: #ffffff; --fg: #0a0a0a; --muted: #6e6e6e; --faint: #a3a3a3;
  --line: #e9e9e9; --soft: #f6f6f6; --hover: #f0f0f0;
  --inv-bg: #0a0a0a; --inv-fg: #ffffff;
  --radius: 14px;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a; --fg: #f5f5f5; --muted: #8c8c8c; --faint: #5c5c5c;
    --line: #232323; --soft: #141414; --hover: #1b1b1b;
    --inv-bg: #f5f5f5; --inv-fg: #0a0a0a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a0a; --fg: #f5f5f5; --muted: #8c8c8c; --faint: #5c5c5c;
  --line: #232323; --soft: #141414; --hover: #1b1b1b;
  --inv-bg: #f5f5f5; --inv-fg: #0a0a0a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans);
       -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 13px; }

/* ---------- Gerüst ---------- */
.app { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }
.seite { border-right: 1px solid var(--line); padding: 20px 14px; display: flex;
         flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.marke { display: flex; align-items: baseline; gap: 6px; padding: 4px 10px;
         font-weight: 750; letter-spacing: .14em; font-size: 15px; }
.marke span { font-weight: 400; letter-spacing: .04em; color: var(--muted); }
nav { display: flex; flex-direction: column; gap: 2px; }
.nav-titel { font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
             color: var(--faint); padding: 14px 10px 6px; }
nav a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 9px;
        color: var(--muted); text-decoration: none; font-size: 14px; }
nav a svg { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none;
            stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
nav a:hover { background: var(--hover); color: var(--fg); }
nav a.aktiv { background: var(--soft); color: var(--fg); font-weight: 560; }
nav a .zahl { margin-left: auto; font-size: 12px; color: var(--faint); }
.unten { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.token-karte { border: 1px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; }
.token-karte:hover { background: var(--hover); }
.token-karte .gross { font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
.token-karte .klein { font-size: 12px; color: var(--muted); }
.leiste { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 10px 0 6px; }
.leiste i { display: block; height: 100%; background: var(--fg); border-radius: 4px; }
.thema { display: flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.thema button { flex: 1; border: 0; background: none; padding: 5px; border-radius: 7px;
                font-size: 12px; color: var(--muted); cursor: pointer; }
.thema button.an { background: var(--soft); color: var(--fg); }

main { min-width: 0; padding: 34px 44px 80px; max-width: 1120px; }
.kopf { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
        margin-bottom: 28px; }
h1 { font-size: 28px; line-height: 1.2; letter-spacing: -.025em; margin: 0; font-weight: 680; }
.unter { color: var(--muted); margin: 6px 0 0; font-size: 14px; }
.pille { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line);
         border-radius: 999px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.pille i { width: 7px; height: 7px; border-radius: 50%; background: var(--fg); }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted);
     font-weight: 600; margin: 0 0 14px; }

/* ---------- Bausteine ---------- */
.raster { display: grid; gap: 16px; }
.r2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.r3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.r4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.karte { border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.karte + .karte, .raster + .karte, .karte + .raster, .raster + .raster { margin-top: 16px; }
.raster > .karte { margin-top: 0; }
.wert { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin-top: 2px; }
.etikett { font-size: 12.5px; color: var(--muted); }
.knopf { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px;
         padding: 0 16px; border-radius: 10px; border: 1px solid var(--fg); background: var(--inv-bg);
         color: var(--inv-fg); font-weight: 560; font-size: 14px; cursor: pointer; white-space: nowrap; }
.knopf:hover { opacity: .86; }
.knopf:disabled { opacity: .4; cursor: default; }
.knopf.hell { background: transparent; color: var(--fg); border-color: var(--line); }
.knopf.hell:hover { background: var(--hover); opacity: 1; }
.knopf small { font-weight: 400; opacity: .65; font-size: 12.5px; }
.zeile { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.zeile.weit { justify-content: space-between; }
.leer { color: var(--muted); padding: 28px 0; text-align: center; font-size: 14px; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px;
        padding: 4px 11px; font-size: 12.5px; color: var(--muted); background: none; cursor: pointer; }
.chip.an { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
.marke-klein { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px;
               border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.marke-klein.voll { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 0 12px 10px 0;
     border-bottom: 1px solid var(--line); }
td { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td:last-child, th:last-child { padding-right: 0; }
.tabelle { overflow-x: auto; }
.rechtsblock { text-align: right; }

.balken { display: grid; grid-template-columns: 92px 1fr 64px; white-space: nowrap; align-items: center; gap: 12px;
          margin: 10px 0; font-size: 14px; }
.spur { height: 8px; background: var(--soft); border-radius: 8px; overflow: hidden; }
.spur i { display: block; height: 100%; background: var(--fg); border-radius: 8px; }
.balken.blass .spur i { background: var(--faint); }
.urteil { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }

.liste-eintrag { display: grid; grid-template-columns: 34px 1fr auto; gap: 14px; align-items: center;
                 padding: 13px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.liste-eintrag:last-child { border-bottom: 0; }
.liste-eintrag:hover { background: var(--hover); }
.symbol { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
          display: grid; place-items: center; }
.symbol svg { width: 16px; height: 16px; stroke: var(--fg); fill: none; stroke-width: 1.6;
              stroke-linecap: round; stroke-linejoin: round; }
.liste-eintrag .titel { font-weight: 560; font-size: 14px; }
.liste-eintrag .kurz { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden;
                       text-overflow: ellipsis; }
.liste-eintrag .rechts { text-align: right; font-size: 12.5px; color: var(--muted); white-space: nowrap; }

.konsole { background: var(--inv-bg); color: var(--inv-fg); border-radius: 12px; padding: 16px;
           font-family: var(--mono); font-size: 12.5px; line-height: 1.65; max-height: 340px;
           overflow: auto; white-space: pre-wrap; }
.konsole:empty::before { content: "Noch kein Training in dieser Sitzung."; opacity: .5; }

.detail { position: fixed; inset: 0; background: rgba(0,0,0,.28); display: none; z-index: 20; }
.detail.offen { display: block; }
.detail .blatt { position: absolute; right: 0; top: 0; bottom: 0; width: min(620px, 100%);
                 background: var(--bg); border-left: 1px solid var(--line); padding: 28px;
                 overflow-y: auto; }
.x { border: 1px solid var(--line); background: none; border-radius: 9px; width: 34px; height: 34px;
     cursor: pointer; font-size: 18px; line-height: 1; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
         background: var(--inv-bg); color: var(--inv-fg); padding: 11px 18px; border-radius: 11px;
         font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 30;
         max-width: calc(100% - 32px); }
.toast.zeigen { opacity: 1; transform: translateX(-50%); }
.hinweis { font-size: 12.5px; color: var(--muted); margin-top: 18px; }
.lade { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor;
        border-right-color: transparent; border-radius: 50%; animation: dreh .7s linear infinite; }
@keyframes dreh { to { transform: rotate(360deg); } }
svg.kurve { width: 100%; height: 220px; display: block; }
.feld { height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px;
        background: var(--bg); width: 140px; }
.abo.aktuell { border-color: var(--fg); }
dl.paare { display: grid; grid-template-columns: auto 1fr; gap: 9px 18px; margin: 0; font-size: 14px; }
dl.paare dt { color: var(--muted); }
dl.paare dd { margin: 0; }

/* ---------- Chart ---------- */
.chartrahmen { position: relative; overflow-x: auto; margin: 14px 0 4px; -webkit-overflow-scrolling: touch; }
.chartrahmen svg { display: block; width: 100%; min-width: 640px; height: auto; font-family: var(--sans); }
.chart-tip { position: absolute; top: 8px; left: 8px; background: var(--bg); border: 1px solid var(--line);
             border-radius: 9px; padding: 7px 10px; font-size: 12px; pointer-events: none; white-space: nowrap;
             box-shadow: 0 4px 14px rgba(0,0,0,.08); font-variant-numeric: tabular-nums; }
.legende { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.legende i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--fg); }
.legende i.gestrichelt { border-top-style: dashed; border-color: var(--muted); }
.legende i.punkt { width: 9px; height: 9px; border: 1.5px solid var(--fg); border-radius: 50%; }
.legende i.dreieck { width: 0; height: 0; border: 5px solid transparent; border-bottom: 8px solid var(--fg); border-top: 0; }

/* ---------- Warum ---------- */
.gruende { margin: 0; padding-left: 18px; display: grid; gap: 6px; line-height: 1.5; }
.fokusliste { display: grid; gap: 8px; margin-top: 8px; font-size: 13.5px; }
.fokusliste div { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; }
.fokusliste b { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--fg); display: grid;
                place-items: center; font-size: 11.5px; }
.beitrag { display: grid; grid-template-columns: minmax(0, 1fr) 120px 60px; gap: 10px; align-items: center;
           font-size: 13.5px; margin-top: 8px; }
.beitrag .achse { position: relative; height: 8px; background: var(--soft); border-radius: 4px; }
.beitrag .achse::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--faint); }
.beitrag .achse i { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--fg); }
.beitrag .achse i.minus { background: var(--faint); }

/* ---------- eigene Indikatoren ---------- */
.formel-form { display: grid; grid-template-columns: 1fr 2fr auto; gap: 10px; align-items: end; }
.formel-form label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 6px; }
.formel-form .feld { width: 100%; }
.formel-form .mono { font-family: var(--mono); font-size: 13px; }
.eigen-zeile { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center;
               padding: 11px 0; border-bottom: 1px solid var(--line); }
.eigen-zeile:last-child { border-bottom: 0; }
.eigen-zeile code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
details.hilfe summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.hilfe dl { margin-top: 10px; }

/* ---------- Chat ---------- */
.chat { display: flex; flex-direction: column; gap: 14px; }
.chat-liste { display: flex; flex-direction: column; gap: 20px; max-height: 640px; overflow-y: auto; padding: 2px 4px 2px 0; }
.chat.voll .chat-liste { max-height: none; min-height: 280px; }
.msg-ich { align-self: flex-end; max-width: 82%; background: var(--inv-bg); color: var(--inv-fg);
           padding: 10px 14px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-ki { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; }
.ki-zeichen { width: 28px; height: 28px; border-radius: 8px; background: var(--inv-bg); color: var(--inv-fg);
              display: grid; place-items: center; font-weight: 750; font-size: 13px; letter-spacing: .02em; }
.ki-text { line-height: 1.6; overflow-wrap: anywhere; }
.ki-text p { margin: 0 0 10px; } .ki-text p:last-child { margin-bottom: 0; }
.ki-text ul { margin: 0 0 10px; padding-left: 20px; display: grid; gap: 4px; }
.msg-hinweis { align-self: center; font-size: 12.5px; color: var(--muted); }
.anhang { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 12px; }
.chat-eingabe { display: flex; gap: 10px; align-items: flex-end; border: 1px solid var(--line); border-radius: 14px;
                padding: 8px 8px 8px 14px; background: var(--bg); }
.chat-eingabe:focus-within { border-color: var(--fg); }
.chat-eingabe textarea { flex: 1; border: 0; background: transparent; resize: none; font: inherit; color: var(--fg);
                         min-height: 26px; max-height: 180px; outline: none; padding: 7px 0; }
.chat-fuss { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.vorschlaege { display: flex; gap: 8px; flex-wrap: wrap; }
.punkte-lade { display: inline-flex; gap: 4px; vertical-align: middle; margin-right: 8px; }
.punkte-lade i { width: 6px; height: 6px; border-radius: 50%; background: var(--fg); animation: puls 1.2s infinite ease-in-out; }
.punkte-lade i:nth-child(2) { animation-delay: .15s; } .punkte-lade i:nth-child(3) { animation-delay: .3s; }
@keyframes puls { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .punkte-lade i, .lade { animation: none; } }

/* ---------- Telefon ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .seite { min-width: 0; position: sticky; top: 0; height: auto; z-index: 10; background: var(--bg);
           border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; gap: 10px; }
  .seite .marke { padding: 0; }
  nav { flex-direction: row; overflow-x: auto; gap: 4px; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  .nav-titel { display: none; }
  nav a { flex: none; padding: 6px 10px; }
  nav a .zahl { display: none; }
  .unten { margin-top: 0; }
  .unten .token-karte, .unten .thema { display: none; }
  main { padding: 22px 16px 60px; }
  .r2, .r3, .r4 { grid-template-columns: 1fr 1fr; }
  .r2.immer-voll, .r3.immer-voll { grid-template-columns: 1fr; }
  h1 { font-size: 24px; }
  .urteil { font-size: 28px; }
  .balken { grid-template-columns: 76px 1fr 60px; gap: 10px; }
}
@media (max-width: 520px) {
  .r2, .r3 { grid-template-columns: 1fr; }
  .r3.drei { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .r3.drei .wert { font-size: 17px !important; }
  .aktionen .karte { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
  .aktionen .karte > div:nth-child(2) { margin-top: 0 !important; }
  .aktionen .karte .kosten { margin: 0 0 0 auto !important; white-space: nowrap; }
  .aktionen .karte .u { display: none; }
  .kopf { flex-direction: column; }
  .rechtsblock { text-align: left; }
}

/* ---------- Anmeldung ---------- */
.tor { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.tor .karte { width: min(400px, 100%); padding: 32px; }
.tor h1 { font-size: 24px; margin: 22px 0 6px; }
.tor label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
.tor .feld { width: 100%; }
.tor .knopf { width: 100%; margin-top: 22px; }
.tor .fehler { color: var(--fg); font-size: 13.5px; margin-top: 14px; min-height: 20px; }

/* ---------- Modellwahl ---------- */
.wahl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.wahl button { text-align: left; border: 1px solid var(--line); background: var(--bg);
               border-radius: 12px; padding: 14px; cursor: pointer; display: flex;
               flex-direction: column; gap: 4px; min-width: 0; }
.wahl button:hover:not(:disabled) { background: var(--hover); }
.wahl button.an { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.wahl button:disabled { cursor: not-allowed; opacity: .45; }
.wahl .n { font-weight: 650; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
.wahl .t { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.wahl .s { font-size: 12px; margin-top: 6px; color: var(--fg); }
.punkte { display: inline-flex; gap: 3px; align-items: center; }
.punkte i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--fg); }
.punkte i.v { background: var(--fg); }
.nutzung-zeile { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center;
                 font-size: 12px; color: var(--muted); margin-top: 6px; }
.nutzung-zeile .leiste { margin: 0; }
select.feld { width: auto; appearance: none; padding-right: 28px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.namelink { border: 0; background: none; padding: 0; font-weight: 650; cursor: pointer; text-align: left;
            text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--faint); }
.namelink:hover { text-decoration-color: var(--fg); }
.abmelden { border: 0; background: none; color: var(--muted); font-size: 12.5px; cursor: pointer; padding: 0; }
.abmelden:hover { color: var(--fg); text-decoration: underline; }
.formular { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 10px; align-items: end; }
.formular label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 6px; }
.formular .feld { width: 100%; }
@media (max-width: 860px) {
  .wahl { grid-template-columns: 1fr; }
  .formular { grid-template-columns: 1fr 1fr; }
  .formel-form { grid-template-columns: 1fr; }
  .beitrag { grid-template-columns: minmax(0, 1fr) 90px 52px; }
  .msg-ich { max-width: 92%; }
}
</style>
</head>
<body>
<div id="wurzel"></div>
<div class="detail" id="detail" onclick="if(event.target===this)zu()"><div class="blatt" id="blatt"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const ICON = {
  uebersicht: '<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
  analyse: '<path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
  indikatoren: '<path d="M3 17l5-6 4 4 8-9"/><path d="M3 21h18"/>',
  strategie: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  training: '<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>',
  verlauf: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  modelle: '<rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/>',
  nutzung: '<path d="M4 19h16M6 15V9M12 15V5M18 15v-3"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>',
  nutzer: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/>',
};
const SEITEN = [
  ["uebersicht", "Übersicht"],
  ["chat", "Chat"],
  ["#KI"],
  ["analyse", "Analyse"], ["indikatoren", "Indikatoren"], ["strategie", "Strategie"],
  ["#Daten"],
  ["verlauf", "Verlauf"], ["modelle", "Modelle"], ["nutzung", "Nutzung & Abo"],
  ["#Inhaber", null, "inhaber"],
  ["nutzer", "Nutzer", "inhaber"],
];
const MREIHE = ["mini", "standard", "max"];
const icon = n => `<svg viewBox="0 0 24 24">${ICON[n] || ICON.verlauf}</svg>`;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const zahl = (x, n = 2) => x == null ? "–" : Number(x).toLocaleString("de-DE", {minimumFractionDigits: n, maximumFractionDigits: n});
const ganz = x => x == null ? "–" : Number(x).toLocaleString("de-DE");
const pz = (x, n = 0) => x == null ? "–" : (x * 100).toLocaleString("de-DE", {minimumFractionDigits: n, maximumFractionDigits: n}) + " %";
const rr = x => x == null ? "–" : (x >= 0 ? "+" : "−") + zahl(Math.abs(x), 1) + " R";
const zeit = s => s ? new Date(s).toLocaleString("de-DE", {day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit"}) : "–";
const datum = s => s ? new Date(s).toLocaleDateString("de-DE") : "–";
const tok = n => `${ganz(n)} ${n === 1 ? "Token" : "Tokens"}`;
const BEREICH = {analyse: "Analyse", indikatoren: "Indikatoren", strategie: "Strategie", training: "Training"};
const merken = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
const lesen = (k, d) => { try { return localStorage.getItem(k) || d; } catch (_) { return d; } };

let ICH = null, STAND = null, seite = "uebersicht";
let gewaehlt = lesen("modell", "standard");
const inhaber = () => ICH && ICH.rolle === "inhaber";

/* ---------- Netz ---------- */
async function api(pfad, body) {
  const r = await fetch(pfad, body === undefined ? {} :
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({fehler: "Keine Antwort vom Server."}));
  if (r.status === 401 && d.anmelden) { ICH = null; tor(); }
  if (!r.ok) throw Object.assign(new Error(d.fehler || "Fehler"), d);
  return d;
}
function toast(text) {
  const t = $("#toast"); t.textContent = text; t.classList.add("zeigen");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("zeigen"), 4200);
}

/* ---------- Anmeldung ---------- */
async function start() {
  const d = await api("/api/ich");
  ICH = d.nutzer;
  if (!ICH) return tor(d.einrichten);
  geruest();
  zeigen();
}
function tor(einrichten = false) {
  $("#wurzel").innerHTML = `<div class="tor"><form class="karte" id="torform">
    <div class="marke" style="padding:0">BENGX <span>KI</span></div>
    <h1>${einrichten ? "Willkommen" : "Anmelden"}</h1>
    <p class="unter" style="margin:0">${einrichten ? "Lege dein Inhaber-Konto an. Als Inhaber hast du keine Grenzen und verwaltest alle anderen." : "Mit deinem Namen und Passwort."}</p>
    <label for="tn">Name</label><input class="feld" id="tn" autocomplete="username" required>
    <label for="tp">Passwort</label><input class="feld" id="tp" type="password" autocomplete="${einrichten ? "new-password" : "current-password"}" required minlength="${einrichten ? 8 : 1}">
    ${einrichten ? `<p class="etikett" style="margin:8px 0 0">Mindestens 8 Zeichen.</p>` : ""}
    <button class="knopf" type="submit">${einrichten ? "Inhaber anlegen" : "Anmelden"}</button>
    <div class="fehler" id="tf"></div></form></div>`;
  $("#tn").focus();
  $("#torform").onsubmit = async e => {
    e.preventDefault();
    try {
      const d = await api(einrichten ? "/api/einrichten" : "/api/anmelden", {name: $("#tn").value, passwort: $("#tp").value});
      ICH = d.nutzer; geruest(); location.hash = "uebersicht"; zeigen();
    } catch (err) { $("#tf").textContent = err.message; }
  };
}
async function abmelden() { await api("/api/abmelden", {}); ICH = null; tor(); }

/* ---------- Gerüst ---------- */
function geruest() {
  $("#wurzel").innerHTML = `<div class="app">
    <aside class="seite">
      <div class="marke">BENGX <span>KI</span></div>
      <nav id="nav"></nav>
      <div class="unten">
        <div class="token-karte" onclick="geh('nutzung')">
          <div class="zeile weit"><b style="font-size:14px">${esc(ICH.name)}</b><span class="marke-klein ${inhaber() ? "voll" : ""}" id="sb-abo">–</span></div>
          <div id="sb-nutzung" style="margin-top:6px"></div>
        </div>
        <div class="zeile weit" style="padding:0 4px"><button class="abmelden" onclick="abmelden()">Abmelden</button></div>
        <div class="thema" id="thema">
          <button data-t="light">Hell</button><button data-t="auto">Auto</button><button data-t="dark">Dunkel</button>
        </div>
      </div>
    </aside>
    <main id="haupt"></main></div>`;
  $$("#thema button").forEach(b => b.onclick = () => thema(b.dataset.t));
  thema(lesen("thema", "auto"));
}
async function laden() {
  STAND = await api("/api/stand");
  const n = STAND.nutzung;
  $("#sb-abo").textContent = n.abo_name;
  $("#sb-nutzung").innerHTML = MREIHE.map(m => nutzungZeile(n.modelle[m])).join("") + nutzungZeile({...n.chat, name: "Chat"});
  navZeichnen();
}
function nutzungZeile(m) {
  const breite = m.limit == null ? 0 : Math.min(100, 100 * m.verbraucht / Math.max(1, m.limit));
  const text = m.gesperrt ? "gesperrt" : m.limit == null ? (inhaber() ? ganz(m.verbraucht) : "∞") : `${ganz(m.verbraucht)}/${ganz(m.limit)}`;
  return `<div class="nutzung-zeile"><span>${esc(m.name)}</span><div class="leiste"><i style="width:${breite}%"></i></div><span class="num">${text}</span></div>`;
}
function navZeichnen() {
  const z = STAND ? STAND.zaehler : {};
  const summe = Object.values(z).reduce((a, b) => a + b, 0);
  $("#nav").innerHTML = SEITEN.filter(([, , r]) => !r || inhaber()).map(([id, name]) => id.startsWith("#")
    ? `<div class="nav-titel">${id.slice(1)}</div>`
    : `<a href="#${id}" class="${id === seite ? "aktiv" : ""}">${icon(id)}${name}${
        id === "verlauf" && summe ? `<span class="zahl">${summe}</span>` : z[id] ? `<span class="zahl">${z[id]}</span>` :
        id === "nutzer" && STAND && STAND.nutzerzahl ? `<span class="zahl">${STAND.nutzerzahl}</span>` : ""}</a>`).join("");
}
function geh(id) { location.hash = id; }
window.addEventListener("hashchange", () => ICH && zeigen());
async function zeigen() {
  seite = location.hash.slice(1) || "uebersicht";
  const eintrag = SEITEN.find(([id]) => id === seite);
  if (!eintrag || (eintrag[2] && !inhaber())) seite = "uebersicht";
  navZeichnen(); zu(); window.scrollTo(0, 0);
  try { await ANSICHT[seite](); }
  catch (e) { if (!e.anmelden) $("#haupt").innerHTML = kopf("Fehler", esc(e.message)); }
}
const kopf = (titel, unter = "", rechts = "") => `<div class="kopf"><div><h1>${titel}</h1>${unter ? `<p class="unter">${unter}</p>` : ""}</div>${rechts}</div>`;
const pille = () => STAND ? `<span class="pille"><i></i>${esc(STAND.nutzung.abo_name)}</span>` : "";

/* ---------- Aktionen ---------- */
async function ausfuehren(knopf, pfad, body, danach) {
  const alt = knopf.innerHTML;
  knopf.disabled = true; knopf.innerHTML = '<span class="lade"></span> Läuft …';
  try { const e = await api(pfad, body || {}); await laden(); await danach(e); }
  catch (err) { toast(err.message); if (err.grenze) await laden().then(() => modellwahlNeu()); }
  finally { if (document.body.contains(knopf)) { knopf.disabled = false; knopf.innerHTML = alt; } modellwahlNeu(); }
}

/* ---------- Modellwahl ---------- */
function modellStatus(id) {
  const n = STAND.nutzung.modelle[id], m = STAND.modelle[id];
  if (n.gesperrt) return {frei: false, text: "Nicht im Abo " + STAND.nutzung.abo_name};
  if (!m.vorhanden) return {frei: false, text: "Noch nicht trainiert"};
  if (n.limit == null) return {frei: true, text: inhaber() ? "Unbegrenzt" : "Ohne Grenze"};
  if (n.rest <= 0) return {frei: false, text: "Limit erreicht · frei am " + datum(STAND.nutzung.auffuellung)};
  return {frei: true, text: `${ganz(n.rest)} von ${ganz(n.limit)} übrig`};
}
let wahlAktion = "analyse", wahlKnopf = null;
function modellwahl(aktion, knopfId, knopfText) {
  wahlAktion = aktion; wahlKnopf = [knopfId, knopfText];
  if (!modellStatus(gewaehlt).frei) gewaehlt = MREIHE.find(m => modellStatus(m).frei) || gewaehlt;
  return `<div class="wahl" id="wahl">${wahlInhalt()}</div>`;
}
function wahlInhalt() {
  return MREIHE.map((id, i) => {
    const m = STAND.modelle[id], s = modellStatus(id), k = STAND.nutzung.kosten[wahlAktion][id];
    return `<button data-m="${id}" class="${id === gewaehlt ? "an" : ""}" ${s.frei ? "" : "disabled"}>
      <span class="n">${esc(m.name)}<span class="punkte" title="Stärke">${[0, 1, 2].map(j => `<i class="${j <= i ? "v" : ""}"></i>`).join("")}</span></span>
      <span class="t">${esc(m.text)}</span>
      <span class="s">${tok(k)} · ${esc(s.text)}</span></button>`;
  }).join("");
}
function modellwahlNeu() {
  // Die Wahl bleibt stehen, auch wenn das Modell gerade nicht geht: der Knopf sagt dann, warum.
  const w = $("#wahl"); if (!w) return;
  w.innerHTML = wahlInhalt();
  w.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { gewaehlt = b.dataset.m; merken("modell", gewaehlt); modellwahlNeu(); });
  const [kid, ktext] = wahlKnopf, k = $("#" + kid);
  if (k) {
    const s = modellStatus(gewaehlt);
    k.disabled = !s.frei;
    k.innerHTML = `${ktext} <small>· ${STAND.modelle[gewaehlt].name} · ${s.frei ? tok(STAND.nutzung.kosten[wahlAktion][gewaehlt]) : s.text.split(" · ")[0]}</small>`;
  }
}

/* ---------- Darstellungen ---------- */
function zeigeAnalyse(d, kompakt = false) {
  const p = d.wahrscheinlichkeiten, i = d.idee;
  const urteil = i ? (i.richtung === "kaufen" ? "Kaufen" : "Verkaufen") : "Kein Signal";
  const max = Math.max(...Object.values(p));
  const fokus = (d.fokus || []).map((f, n) => ({...f, nr: n + 1})).filter(f => f.chart_index != null && f.nr <= 3);
  return `
    <div class="zeile weit"><div>
      <div class="etikett">Einschätzung für die Kerze vom ${zeit(d.kerze)}</div>
      <div class="urteil" style="margin-top:6px${kompakt ? ";font-size:26px" : ""}">${urteil}</div>
    </div><div class="rechtsblock"><div class="etikett">Schluss</div><div class="wert num">${zahl(d.schluss)}</div></div></div>
    ${d.chart ? chart(d.chart, {niveaus: i, fokus, zukunft: d.horizont, hoehe: kompakt ? 240 : 320}) : ""}
    <div style="margin-top:14px">${["hoch", "seitwärts", "runter"].map(k => `
      <div class="balken ${p[k] === max ? "" : "blass"}"><span>${k[0].toUpperCase() + k.slice(1)}</span>
      <div class="spur"><i style="width:${(p[k] * 100).toFixed(1)}%"></i></div><span class="num" style="text-align:right">${pz(p[k], 1)}</span></div>`).join("")}
    </div>
    ${i ? `<div class="raster r3 drei" style="margin-top:18px">
      <div><div class="etikett">Einstieg</div><div class="wert num" style="font-size:20px">${zahl(i.einstieg)}</div></div>
      <div><div class="etikett">Stop</div><div class="wert num" style="font-size:20px">${zahl(i.stop)}</div></div>
      <div><div class="etikett">Ziel</div><div class="wert num" style="font-size:20px">${zahl(i.ziel)}</div></div></div>`
      : `<p class="etikett" style="margin-top:14px">Weder hoch noch runter erreicht ${pz(d.schwelle)} Sicherheit. Die KI hält sich zurück.</p>`}
    ${d.gruende ? zeigeWarum(d, kompakt) : ""}
    <p class="hinweis">Stop und Ziel je ${zahl(d.abstand)} entfernt · Blick ${d.horizont} Kerzen nach vorn · Schwelle ${pz(d.schwelle)}</p>`;
}
function zeigeWarum(d, kompakt) {
  const wann = f => f.vor === 0 ? "jüngste Kerze" : f.vor === 1 ? "Kerze davor" : `${f.vor} Kerzen zurück`;
  const groesste = Math.max(...d.merkmale.map(m => Math.abs(m.beitrag)), 0.01);
  return `<h2 style="margin-top:24px">Warum diese Einschätzung</h2>
    <ul class="gruende">${d.gruende.map(g => `<li>${esc(g)}</li>`).join("")}</ul>
    ${kompakt ? "" : `<div class="raster r2 immer-voll" style="margin-top:18px">
      <div><div class="etikett">Worauf das Gehirn geachtet hat</div><div class="fokusliste">
        ${d.fokus.slice(0, 5).map((f, n) => `<div><b>${n + 1}</b><span>${esc(wann(f))} · ${esc(f.form)}</span><span class="num">${pz(f.gewicht)}</span></div>`).join("")}</div></div>
      <div><div class="etikett">Was die Richtung trägt, in Prozentpunkten</div>
        ${d.merkmale.map(m => { const w = Math.min(50, 50 * Math.abs(m.beitrag) / groesste);
          return `<div class="beitrag"><span>${esc(m.gruppe)}</span><span class="achse"><i class="${m.beitrag < 0 ? "minus" : ""}" style="${m.beitrag < 0 ? `right:50%;width:${w}%` : `left:50%;width:${w}%`}"></i></span><span class="num" style="text-align:right">${(m.beitrag >= 0 ? "+" : "−") + zahl(Math.abs(m.beitrag) * 100, 1)}</span></div>`; }).join("")}</div></div>
    <p class="hinweis">Gemessen am Netz selbst: die Aufmerksamkeit über alle Blöcke, und wie stark die Wahrscheinlichkeit sinkt, wenn man ihm eine Merkmalsgruppe wegnimmt. Die Kreise im Chart markieren die Kerzen 1 bis 3.</p>`}`;
}

/* ---------- Kerzen-Chart ---------- */
const CHARTS = {};
let chartNr = 0;
function chart(d, o = {}) {
  const id = "kc" + (++chartNr), n = d.close.length, zuk = o.niveaus ? (o.zukunft || 24) : 0;
  const W = 960, PR = 74, PL = 6, H = o.hoehe || 320, UH = 96, ABST = 16, ZH = 24;
  const unten = (o.unten || []).filter(u => u.werte.some(v => v != null));
  const gesH = H + unten.reduce(a => a + UH + ABST, 0) + ZH;
  const sw = (W - PR - PL) / (n + zuk), X = i => PL + (i + 0.5) * sw;
  const linien = [...(d.ema50 ? [{name: "EMA 50", werte: d.ema50, stil: "ema"}] : []), ...(o.linien || [])];
  const alle = [...d.high, ...d.low];
  linien.forEach(l => l.werte.forEach(v => v != null && alle.push(v)));
  if (o.niveaus) alle.push(o.niveaus.stop, o.niveaus.ziel);
  let lo = Math.min(...alle), hi = Math.max(...alle); const rand = (hi - lo) * .06 || 1; lo -= rand; hi += rand;
  const Y = v => 10 + (hi - v) * (H - 20) / (hi - lo);
  const t = [];
  const schilder = o.niveaus ? [o.niveaus.ziel, o.niveaus.einstieg, o.niveaus.stop].map(Y) : [];
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * (k + .5) / 5, frei = schilder.every(y => Math.abs(y - Y(v)) > 16);
    t.push(`<line x1="${PL}" x2="${W - PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/>${frei ? `<text x="${W - PR + 8}" y="${Y(v) + 4}" font-size="12" fill="var(--muted)">${zahl(v)}</text>` : ""}`); }
  if (o.niveaus) {
    const nv = o.niveaus, x0 = X(n - 1), x1 = W - PR;
    t.push(`<rect x="${x0}" width="${x1 - x0}" y="${Math.min(Y(nv.ziel), Y(nv.einstieg))}" height="${Math.abs(Y(nv.ziel) - Y(nv.einstieg))}" fill="var(--fg)" opacity=".07"/>`);
    t.push(`<rect x="${x0}" width="${x1 - x0}" y="${Math.min(Y(nv.stop), Y(nv.einstieg))}" height="${Math.abs(Y(nv.stop) - Y(nv.einstieg))}" fill="url(#${id}-schraffur)"/>`);
    [["Ziel", nv.ziel, "6 4"], ["Einstieg", nv.einstieg, ""], ["Stop", nv.stop, "2 4"]].forEach(([name, v, strich]) =>
      t.push(`<line x1="${PL}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--fg)" stroke-width="1.2" ${strich ? `stroke-dasharray="${strich}"` : ""} opacity="${name === "Einstieg" ? .55 : .9}"/>
        <rect x="${x1 + 2}" y="${Y(v) - 10}" width="${PR - 4}" height="20" rx="5" fill="${name === "Einstieg" ? "var(--bg)" : "var(--inv-bg)"}" stroke="var(--fg)"/>
        <text x="${x1 + PR / 2}" y="${Y(v) + 4}" font-size="11.5" text-anchor="middle" fill="${name === "Einstieg" ? "var(--fg)" : "var(--inv-fg)"}" font-weight="600">${name}</text>`));
  }
  (o.fokus || []).forEach(f => t.push(`<rect x="${X(f.chart_index) - sw / 2}" width="${sw}" y="0" height="${H}" fill="var(--fg)" opacity="${.04 + .16 * Math.min(1, f.gewicht * 3)}"/>`));
  linien.forEach((l, k) => { const pkt = l.werte.map((v, i) => v == null ? null : `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
    const ema = (l.stil || "").startsWith("ema");
    const strich = ema ? `stroke="var(--muted)" stroke-dasharray="${l.stil === "ema2" ? "2 3" : "5 4"}"` : `stroke="var(--fg)" ${["", "stroke-dasharray=\"8 3\"", "stroke-dasharray=\"2 3\""][k % 3]}`;
    teilLinien(pkt).forEach(z => t.push(`<polyline points="${z}" fill="none" ${strich} stroke-width="1.5"/>`)); });
  for (let i = 0; i < n; i++) {
    const o_ = d.open[i], c = d.close[i], x = X(i), b = Math.max(1, sw * .62), oben = Y(Math.max(o_, c)), h = Math.max(1, Math.abs(Y(o_) - Y(c)));
    t.push(`<line x1="${x}" x2="${x}" y1="${Y(d.high[i])}" y2="${Y(d.low[i])}" stroke="var(--fg)" stroke-width="1"/>
      <rect x="${x - b / 2}" y="${oben}" width="${b}" height="${h}" fill="${c >= o_ ? "var(--bg)" : "var(--fg)"}" stroke="var(--fg)" stroke-width="1"/>`);
  }
  const belegt = [];
  (o.fokus || []).forEach(f => { const x = X(f.chart_index); let y = Y(d.low[f.chart_index]) + 16;
    while (belegt.some(([bx, by]) => Math.abs(bx - x) < 20 && Math.abs(by - y) < 20)) y += 21;
    belegt.push([x, y]);
    t.push(`<circle cx="${x}" cy="${y}" r="9" fill="var(--bg)" stroke="var(--fg)" stroke-width="1.5"/><text x="${x}" y="${y + 4}" font-size="11" text-anchor="middle" fill="var(--fg)" font-weight="700">${f.nr}</text>`); });
  (o.treffer || []).forEach(i => { if (i < 0 || i >= n) return; const x = X(i), y = Y(d.low[i]) + 8;
    t.push(`<path d="M${x} ${y} l5 9 h-10 z" fill="var(--fg)"/>`); });
  let y0 = H + ABST;
  unten.forEach(u => {
    const w = u.werte.filter(v => v != null); let ul = Math.min(...w), uh = Math.max(...w);
    const rsiArt = ul >= 0 && uh <= 100 && uh - ul > 20; if (rsiArt) { ul = 0; uh = 100; }
    if (uh === ul) { uh += 1; ul -= 1; }
    const Yu = v => y0 + 6 + (uh - v) * (UH - 12) / (uh - ul);
    t.push(`<rect x="${PL}" y="${y0}" width="${W - PR - PL}" height="${UH}" fill="none" stroke="var(--line)"/>`);
    (rsiArt ? [30, 70] : ul < 0 && uh > 0 ? [0] : []).forEach(v => t.push(`<line x1="${PL}" x2="${W - PR}" y1="${Yu(v)}" y2="${Yu(v)}" stroke="var(--faint)" stroke-dasharray="3 3"/><text x="${W - PR + 8}" y="${Yu(v) + 4}" font-size="11" fill="var(--muted)">${v}</text>`));
    teilLinien(u.werte.map((v, i) => v == null ? null : `${X(i).toFixed(1)},${Yu(v).toFixed(1)}`)).forEach(z => t.push(`<polyline points="${z}" fill="none" stroke="var(--fg)" stroke-width="1.5"/>`));
    const letzt = [...u.werte].reverse().find(v => v != null);
    t.push(`<text x="${PL + 8}" y="${y0 + 16}" font-size="12" fill="var(--fg)" font-weight="600">${esc(u.name)} <tspan fill="var(--muted)" font-weight="400">${zahl(letzt)}</tspan></text>`);
    y0 += UH + ABST;
  });
  const schritt = Math.ceil(n / 5);
  for (let i = schritt - 1; i < n; i += schritt) t.push(`<text x="${X(i)}" y="${gesH - 6}" font-size="11.5" text-anchor="middle" fill="var(--muted)">${kurzzeit(d.zeit[i])}</text>`);
  CHARTS[id] = {d, X, sw, n, W, PR, PL};
  const legende = [`<span><i style="width:9px;height:12px;border:1.5px solid var(--fg)"></i>Kerze</span>`,
    ...linien.map((l, k) => { const ema = (l.stil || "").startsWith("ema");

function kurve(v) {
  const W = 800, H = 220, P = 6;
  const alle = [...v.schluss, ...v.ema50, ...v.ema200].filter(x => x != null);
  const lo = Math.min(...alle), hi = Math.max(...alle), n = v.schluss.length;
  const X = i => P + i * (W - 2 * P) / (n - 1), Y = y => H - P - (y - lo) * (H - 2 * P) / ((hi - lo) || 1);
  const linie = r => r.map((y, i) => y == null ? "" : `${X(i).toFixed(1)},${Y(y).toFixed(1)}`).filter(Boolean).join(" ");
  return `<svg class="kurve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${linie(v.ema200)}" fill="none" stroke="var(--faint)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
    <polyline points="${linie(v.ema50)}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
    <polyline points="${linie(v.schluss)}" fill="none" stroke="var(--fg)" stroke-width="1.8" vector-effect="non-scaling-stroke"/>

}

function md(text) {
  const zeilen = esc(text).split("\n"), raus = []; let liste = null, absatz = [];
  const fett = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, '<code class="mono">$1</code>');
  const absatzZu = () => { if (absatz.length) { raus.push(`<p>${fett(absatz.join("<br>"))}</p>`); absatz = []; } };
  const listeZu = () => { if (liste) { raus.push(`<ul>${liste.map(l => `<li>${fett(l)}</li>`).join("")}</ul>`); liste = null; } };
  zeilen.forEach(z => {
    const m = z.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)$/);
    if (m) { absatzZu(); (liste ||= []).push(m[1]); }
    else if (!z.trim()) { absatzZu(); listeZu(); }
    else { listeZu(); absatz.push(z.replace(/^#+\s*/, "")); }
  });
  absatzZu(); listeZu();
  return raus.join("");
}

    `<div class="msg-ki" id="denkt"><div class="ki-zeichen">B</div><div style="min-width:0"><div class="etikett" style="padding-top:5px"><span class="punkte-lade"><i></i><i></i><i></i></span><span id="denkt-text">denkt nach und rechnet …</span></div><div class="ki-text" id="denkt-live" style="margin-top:6px"></div></div></div>`);
  liste.scrollTop = liste.scrollHeight;
  try {
    const r = await api("/api/chat", {bereich: chatBereich, text});
    $("#denkt").outerHTML = zeigeNachricht(r.antwort);
    $("#chat-stand").textContent = chatKontingent(r.kontingent);
    chartsNachRechts(liste);
    laden().catch(() => {});
  } catch (err) {
    const d = $("#denkt"); if (d) d.outerHTML = `<div class="msg-hinweis">${esc(err.message)}</div>`;
    if (!err.anmelden) feld.value = text;
  } finally {
    chatLaeuft = false; if (document.body.contains(knopf)) knopf.disabled = false;
    const l = $("#chat-liste"); if (l) l.scrollTop = l.scrollHeight;
  }
}

        <p class="hinweis">${n.unbegrenzt ? "Abos vergibst du unter Nutzer." : "Das Abo ändert der Inhaber. Bezahlung kommt später."}</p></div>
      <div class="raster r2 immer-voll">
        <div class="karte"><h2>Was kostet was</h2><table><thead><tr><th>Aktion</th>${MREIHE.map(id => `<th class="r">${esc(n.modelle[id].name)}</th>`).join("")}</tr></thead><tbody>
          ${Object.entries(n.kosten).map(([a, k]) => `<tr><td>${esc(n.aktionen[a])}</td>${MREIHE.map(id => `<td class="r num">${k[id]}</td>`).join("")}</tr>`).join("")}
          <tr><td>Indikatoren</td><td class="r" colspan="3" style="color:var(--muted)">frei</td></tr></tbody></table>
          <p class="hinweis">Fehlt etwas, wird nichts verbraucht. Scheitert eine Aktion, kommt der Verbrauch zurück.</p></div>
        <div class="karte"><h2>Buchungen</h2>${b.length ? `<div class="tabelle" style="max-height:360px;overflow:auto"><table><tbody>
          ${b.map(x => `<tr><td class="num" style="color:var(--muted);white-space:nowrap">${zeit(x.zeit)}</td><td>${esc(x.text)}</td><td class="r num"><b>${x.menge > 0 ? "+" : "−"}${ganz(Math.abs(x.menge))}</b></td></tr>`).join("")}
          </tbody></table></div>` : `<div class="leer">Noch keine.</div>`}</div></div>`;
  },

  async nutzer() {
    await laden();
    const liste = await api("/api/nutzer");
    const abos = STAND.nutzung.abos;
    $("#haupt").innerHTML = kopf("Nutzer", "Wer die KI nutzen darf und mit welchem Abo. Nur du siehst diese Seite.", pille()) + `
      <div class="karte"><h2>Neuer Nutzer</h2><form class="formular" id="neu">
        <div><label for="nn">Name</label><input class="feld" id="nn" required></div>
        <div><label for="np">Passwort (mind. 8)</label><input class="feld" id="np" type="password" minlength="8" required autocomplete="new-password"></div>
        <div><label for="na">Abo</label><select class="feld" id="na">${Object.entries(abos).map(([id, a]) => `<option value="${id}">${esc(a.name)}</option>`).join("")}</select></div>
        <div><button class="knopf" type="submit">Anlegen</button></div></form></div>
      <div class="karte"><div class="tabelle"><table><thead><tr><th>Name</th><th>Abo</th>${MREIHE.map(id => `<th>${esc(STAND.modelle[id].name)}</th>`).join("")}<th>Chat</th><th class="r">Aktionen</th><th></th></tr></thead><tbody>
        ${liste.map(u => `<tr><td><button class="namelink" data-zeig="${u.id}">${esc(u.name)}</button><div class="etikett">seit ${datum(u.erstellt)}</div></td>
          <td>${u.rolle === "inhaber" ? `<span class="marke-klein voll">Inhaber</span>` : `<select class="feld" data-abo="${u.id}" style="height:34px">${Object.entries(abos).map(([id, a]) => `<option value="${id}" ${id === u.abo ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select>`}</td>
          ${MREIHE.map(id => { const m = u.modelle[id]; return `<td class="num" style="white-space:nowrap">${m.gesperrt ? `<span style="color:var(--faint)">gesperrt</span>` : m.limit == null ? ganz(m.verbraucht) + (u.rolle === "inhaber" ? "" : " / ∞") : `${ganz(m.verbraucht)} / ${ganz(m.limit)}${m.rest === 0 ? " ●" : ""}`}</td>`; }).join("")}
          <td class="num" style="white-space:nowrap">${u.chat.limit == null ? ganz(u.chat.verbraucht) : `${ganz(u.chat.verbraucht)} / ${ganz(u.chat.limit)}${u.chat.rest === 0 ? " ●" : ""}`}</td>
          <td class="r num">${ganz(u.aktionen)}</td>
          <td class="r" style="white-space:nowrap">${u.rolle === "inhaber" ? "" : `<button class="chip" data-pw="${u.id}" data-name="${esc(u.name)}">Passwort</button> <button class="chip" data-weg="${u.id}" data-name="${esc(u.name)}">Löschen</button>`}</td></tr>`).join("")}
        </tbody></table></div><p class="hinweis">Namen antippen für Nutzung, Verlauf und Buchungen. ● = Limit erreicht. Das Abo gilt sofort; schon Verbrauchtes zählt im Monat weiter.</p></div>`;
    $$("[data-zeig]").forEach(k => k.onclick = () => nutzerDetail(k.dataset.zeig));
    $("#neu").onsubmit = async e => { e.preventDefault();
      try { await api("/api/nutzer", {name: $("#nn").value, passwort: $("#np").value, abo: $("#na").value}); toast("Angelegt."); ANSICHT.nutzer(); }
      catch (err) { toast(err.message); } };
    $$("[data-abo]").forEach(s => s.onchange = async () => {
      try { await api("/api/nutzer/abo", {id: s.dataset.abo, abo: s.value}); toast("Abo geändert."); ANSICHT.nutzer(); } catch (err) { toast(err.message); } });
    // Passwort: kleines Formular im Seitenblatt statt Browser-Dialog.
    $$("[data-pw]").forEach(k => k.onclick = () => {
      $("#blatt").innerHTML = `<div class="zeile weit" style="margin-bottom:22px;align-items:flex-start;flex-wrap:nowrap">
          <div><span class="marke-klein">Passwort</span><h1 style="font-size:22px;margin-top:10px">${esc(k.dataset.name)}</h1>
          <p class="unter">Neues Passwort setzen. Bestehende Anmeldungen enden.</p></div>
          <button class="x" onclick="zu()" aria-label="Schließen">×</button></div>
        <form id="pwform"><label class="etikett" for="pwneu" style="display:block;margin-bottom:6px">Neues Passwort (mind. 8 Zeichen)</label>
          <input class="feld" id="pwneu" type="password" minlength="8" required autocomplete="new-password" style="width:100%">
          <button class="knopf" type="submit" style="margin-top:16px">Passwort setzen</button></form>`;
      $("#detail").classList.add("offen");
      $("#pwneu").focus();
      $("#pwform").onsubmit = async e => { e.preventDefault();
        try { await api("/api/nutzer/passwort", {id: k.dataset.pw, passwort: $("#pwneu").value}); zu(); toast("Passwort geändert. Bestehende Anmeldungen sind beendet."); }
        catch (err) { toast(err.message); } };
    });
    // Löschen: erster Klick fragt nach, zweiter Klick löscht.
    $$("[data-weg]").forEach(k => k.onclick = async () => {
      if (k.dataset.sicher !== "1") {
        k.dataset.sicher = "1"; k.classList.add("an"); k.textContent = "Wirklich löschen?";
        setTimeout(() => { if (document.body.contains(k)) { k.dataset.sicher = ""; k.classList.remove("an"); k.textContent = "Löschen"; } }, 4000);
        return;
      }
      try { await api("/api/nutzer/loeschen", {id: k.dataset.weg}); toast(`${k.dataset.name} gelöscht. Der Verlauf bleibt.`); ANSICHT.nutzer(); } catch (err) { toast(err.message); } });
  },
};

/* ---------- Training beobachten ---------- */
let beobachter = null, lief = false;
async function beobachten() {
  clearTimeout(beobachter);
  const log = $("#log"); if (!log) return;
  const t = await api("/api/training");
  log.textContent = t.zeilen.join("\n"); log.scrollTop = log.scrollHeight;
  const name = t.modell ? STAND.modelle[t.modell].name : "";
  $("#trainstatus").textContent = t.status === "laeuft" ? `${name} lernt …` : t.status === "fertig" ? `${name} fertig` : t.status === "fehler" ? `${name} fehlgeschlagen` : "";
  $$("[data-train]").forEach(k => { k.disabled = t.status === "laeuft"; });
  if (t.status === "laeuft") { lief = true; beobachter = setTimeout(beobachten, 1500); }
  else if (lief && seite === "modelle") { lief = false; toast(t.status === "fertig" ? `${name} ist fertig trainiert.` : "Training fehlgeschlagen."); ANSICHT.modelle(); }
}

/* ---------- Thema ---------- */
function thema(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  $$("#thema button").forEach(b => b.classList.toggle("an", b.dataset.t === t));
  merken("thema", t);
}
(() => { const t = lesen("thema", "auto"); if (t !== "auto") document.documentElement.setAttribute("data-theme", t); })();
start().catch(e => { $("#wurzel").innerHTML = `<div class="tor"><div class="karte">${esc(e.message)}</div></div>`; });
</script>
