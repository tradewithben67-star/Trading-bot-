<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading 3D-Welt</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  /* Die Buehne ist immer 540x960 gedacht (9:16). Aufgenommen wird mit
     doppelter Pixeldichte, also 1080x1920. Im Browser wird sie nur skaliert. */
  #buehne{position:relative;width:540px;height:960px;overflow:hidden;flex:none;
    transform-origin:center center;background:#050507;
    font-family:Inter,"Inter Display",Arial,sans-serif;color:#EDEEF2}
  #buehne canvas{position:absolute;inset:0;display:block}
  .ebene{position:absolute;inset:0;pointer-events:none}

  /* Karten: dunkles Glas, feiner Silberrand, Chrom-Schrift */
  .karte{position:absolute;left:24px;right:24px;top:94px;
    background:linear-gradient(180deg,rgba(28,24,40,.78),rgba(12,11,18,.82));
    border:1px solid rgba(255,255,255,.13);border-radius:22px;padding:18px 22px 19px;
    box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
    transform-origin:50% 0;opacity:0}
  .karte:before{content:"";position:absolute;left:22px;right:22px;top:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(196,170,255,.85),transparent)}
  .karte.unten{top:auto;bottom:206px;transform-origin:50% 100%}
  .karte .zeile{display:flex;align-items:center;gap:13px}
  .karte .symbol{flex:none;width:40px;height:40px;border-radius:12px;display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:21px;color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.4)}
  .s-lila{background:linear-gradient(160deg,#B79BFF,#7C3AED 55%,#4C1D95)}
  .s-chrom{background:linear-gradient(160deg,#FFFFFF,#C9CCD6 45%,#7D808C 75%,#E6E8EE);color:#15151C!important}
  .chrom{background:linear-gradient(180deg,#FFFFFF 0%,#E4E6EC 45%,#A9ADB9 70%,#F1F2F6 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .karte h2{margin:0;font-size:25px;line-height:1.15;font-weight:800;letter-spacing:-.4px}
  .karte p{margin:7px 0 0;font-size:16.5px;line-height:1.4;color:#A7ABB8}
  .karte .klein{font-size:12.5px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:#B79BFF;margin-bottom:7px}
  .karte.titel h2{font-size:40px;letter-spacing:-1.2px}
  .legende{display:flex;flex-direction:column;gap:11px}
  .legende div{display:flex;align-items:center;gap:13px;font-size:17px;font-weight:600;color:#E4E6EC}
  .legende i{width:16px;height:28px;border-radius:5px;display:block;position:relative}
  .legende i:before{content:"";position:absolute;left:7px;top:-7px;bottom:-7px;width:2px;background:inherit;border-radius:2px}
  .legende small{font-size:13px;color:#7F8492;font-weight:500;margin-top:2px}

  .tag{position:absolute;left:0;top:0;white-space:nowrap;
    background:rgba(16,14,24,.82);border:1px solid rgba(255,255,255,.16);border-radius:999px;
    padding:6px 12px 6px 10px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;color:#ECEDF1;
    box-shadow:0 6px 18px rgba(0,0,0,.5);opacity:0;transform-origin:0 50%;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .tag b{width:8px;height:8px;border-radius:50%;display:block;box-shadow:0 0 8px currentColor}

  #schluss{position:absolute;left:24px;right:24px;top:94px;text-align:center;opacity:0;
    background:linear-gradient(180deg,rgba(28,24,40,.78),rgba(12,11,18,.82));
    border:1px solid rgba(255,255,255,.13);border-radius:22px;padding:24px 22px 22px;
    box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  #schluss .marke{font-size:40px;font-weight:800;letter-spacing:-1.2px}
  #schluss .satz{font-size:16.5px;color:#A7ABB8;margin-top:9px;line-height:1.4}
  #hinweis{position:absolute;left:0;right:0;top:712px;text-align:center;font-size:12px;color:#6E7380;letter-spacing:.6px;opacity:0}
  #blitz{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,rgba(139,92,246,.55),rgba(76,29,149,.35) 60%,transparent);opacity:0}
  #vignette{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
</style>
</head>
<body>
<div id="buehne">
  <div id="vignette" class="ebene"></div>
  <div id="blitz" class="ebene"></div>
  <div id="karten" class="ebene"></div>
  <div id="tags" class="ebene"></div>
  <div id="schluss">
    <div class="marke chrom">Das ist Trading.</div>
    <div class="satz">Kaufen, verkaufen – und das Risiko im Griff behalten.</div>
  </div>
  <div id="hinweis">Nur zur Bildung · Keine Anlageberatung</div>
</div>
<script src="vendor/three-paket.min.js"></script>
<script>
/* Ein Erklaerfilm als 3D-Welt: schwarzer Spiegelboden, Chrom und Lila,
   eine durchgehende Kamerafahrt, Karten aus dunklem Glas. Jedes Bild
   haengt allein an der Bildnummer (window.zeichne(b), b darf gebrochen
   sein), damit die Aufnahme sich Zeit lassen und 60 fps liefern kann. */
(function(){
"use strict";
var B = 540, H = 960, FPS = 30, LAENGE = 960;   /* 32 Sekunden, Zeitleiste in 30 fps */
window.__laenge = LAENGE; window.__fps = FPS;

/* ---------- Farben ---------- */
var LILA = "#8B5CF6", LILA_HELL = "#B79BFF", LILA_TIEF = "#4C1D95", SILBER = "#D9DCE3", NEBEL = "#07060B";

/* ---------- Helfer ---------- */
function klemm(t){ return t < 0 ? 0 : t > 1 ? 1 : t; }
function sp(b, von, bis){ return klemm((b - von) / (bis - von)); }
function raus(t){ t = klemm(t); return 1 - Math.pow(1 - t, 3); }
function weich(t){ t = klemm(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }
function feder(t){ t = klemm(t); var s = 1.9, u = t - 1; return 1 + (s + 1)*u*u*u + s*u*u; }
function zufall(saat){ return function(){ saat |= 0; saat = saat + 0x6D2B79F5 | 0;
  var t = Math.imul(saat ^ saat >>> 15, 1 | saat); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function v(x, y, z){ return new THREE.Vector3(x, y, z); }

/* ---------- Renderer, Nachbearbeitung ---------- */
var buehne = document.getElementById("buehne");
var DPR = window.devicePixelRatio || 1;
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(DPR);
renderer.setSize(B, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
buehne.insertBefore(renderer.domElement, buehne.firstChild);

var szene = new THREE.Scene();
szene.fog = new THREE.Fog(NEBEL, 20, 62);
var kamera = new THREE.PerspectiveCamera(42, B / H, 0.1, 300);

/* Hintergrund: fast schwarz, am Horizont ein Hauch Lila */
(function(){
  var c = document.createElement("canvas"); c.width = 4; c.height = 512;
  var g = c.getContext("2d"), v = g.createLinearGradient(0, 0, 0, 512);
  v.addColorStop(0, "#030305"); v.addColorStop(.42, "#0A0712"); v.addColorStop(.56, "#170C2B");
  v.addColorStop(.66, "#0A0712"); v.addColorStop(1, "#050507");
  g.fillStyle = v; g.fillRect(0, 0, 4, 512);
  var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; szene.background = t;
})();

/* Umgebung fuer Chrom: ein dunkler Raum mit weissen und lila Lichtflaechen */
(function(){
  var raum = new THREE.Scene();
  raum.add(new THREE.Mesh(new THREE.BoxGeometry(30, 16, 30), new THREE.MeshBasicMaterial({ color: 0x050508, side: THREE.BackSide })));
  function flaeche(w, h, farbe, staerke, x, y, z, rx, ry){
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(farbe).multiplyScalar(staerke), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.rotation.set(rx || 0, ry || 0, 0); raum.add(m);
  }
  flaeche(14, 2.2, 0xffffff, 1.7, 0, 7.5, 0, Math.PI / 2);         /* Lichtband oben */
  flaeche(3, 10, 0xffffff, 2.2, -14.5, 2, 4, 0, Math.PI / 2);       /* Softbox links */
  flaeche(4, 9, LILA, 3.5, 14.5, 1, -2, 0, -Math.PI / 2);           /* lila Seite rechts */
  flaeche(12, 1.2, LILA_HELL, 2.5, 0, 1.5, -14.5);                  /* lila Band hinten */
  flaeche(22, 7, 0xffffff, 1.5, 0, 2, 14.5, 0, Math.PI);            /* grosse Softbox vorn */
  var pm = new THREE.PMREMGenerator(renderer);
  szene.environment = pm.fromScene(raum, .02).texture;
})();

var renderZiel = new THREE.WebGLRenderTarget(B * DPR, H * DPR, { type: THREE.HalfFloatType, samples: 4 });
var composer = new THREE.EffectComposer(renderer, renderZiel);
composer.setPixelRatio(DPR); composer.setSize(B, H);
composer.addPass(new THREE.RenderPass(szene, kamera));
var bloom = new THREE.UnrealBloomPass(new THREE.Vector2(B * DPR, H * DPR), .48, .5, .96);
composer.addPass(bloom);
composer.addPass(new THREE.OutputPass());

/* ---------- Licht ---------- */
szene.add(new THREE.HemisphereLight(0x9C8CFF, 0x050507, .55));
var sonne = new THREE.DirectionalLight(0xffffff, 2.4);
sonne.castShadow = true;
sonne.shadow.mapSize.set(2048, 2048);
var sc = sonne.shadow.camera; sc.left = -16; sc.right = 16; sc.top = 16; sc.bottom = -16; sc.near = 1; sc.far = 70;
sonne.shadow.bias = -0.0006; sonne.shadow.radius = 5;
szene.add(sonne); szene.add(sonne.target);
var kante = new THREE.DirectionalLight(LILA, 2.2);   /* lila Kantenlicht von hinten */
szene.add(kante); szene.add(kante.target);

/* ---------- Materialien ---------- */
var CHROM = new THREE.MeshStandardMaterial({ color: 0xF2F3F7, metalness: 1, roughness: .14, envMapIntensity: 1.0 });
var LILA_MAT = new THREE.MeshPhysicalMaterial({ color: LILA, metalness: .25, roughness: .2, clearcoat: 1, clearcoatRoughness: .08,
  emissive: LILA_TIEF, emissiveIntensity: .55, envMapIntensity: 1.1 });
var SCHWARZ_GLANZ = new THREE.MeshPhysicalMaterial({ color: 0x0B0B10, metalness: .4, roughness: .4, clearcoat: .6, clearcoatRoughness: .32, envMapIntensity: .6 });
var LEUCHT_LILA = new THREE.MeshBasicMaterial({ color: new THREE.Color(LILA_HELL).multiplyScalar(2.2), toneMapped: false });
var LEUCHT_WEISS = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffffff).multiplyScalar(2.0), toneMapped: false });

function teil(geo, mat, x, y, z, schatten){
  var m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = schatten !== false; m.receiveShadow = true; szene.add(m); return m;
}
function rund(b, h, t, r){ return new THREE.RoundedBoxGeometry(b, h, t, 4, Math.min(r, h / 2 - .001, b / 2 - .001)); }

/* ---------- Boden: schwarzer Spiegel, feines Raster, weiche Schatten ---------- */
var spiegel = new THREE.Reflector(new THREE.PlaneGeometry(260, 120), {
  color: 0x3A3A44, textureWidth: B * DPR, textureHeight: H * DPR, clipBias: .003 });
spiegel.rotation.x = -Math.PI / 2; spiegel.position.set(55, 0, 0); szene.add(spiegel);
var dunkel = new THREE.Mesh(new THREE.PlaneGeometry(260, 120), new THREE.MeshBasicMaterial({ color: 0x050507, transparent: true, opacity: .9 }));
dunkel.rotation.x = -Math.PI / 2; dunkel.position.set(55, .002, 0); szene.add(dunkel);
var schattenBoden = new THREE.Mesh(new THREE.PlaneGeometry(260, 120), new THREE.ShadowMaterial({ opacity: .55 }));
schattenBoden.rotation.x = -Math.PI / 2; schattenBoden.position.set(55, .004, 0); schattenBoden.receiveShadow = true; szene.add(schattenBoden);
var raster = new THREE.GridHelper(260, 260, LILA, LILA);
raster.material.transparent = true; raster.material.opacity = .2; raster.material.depthWrite = false;
raster.position.set(55, .006, 0); szene.add(raster);

/* schlanke schwarze Saeulen mit lila Lichtkante: Tiefe, ohne zu stoeren */
(function(){
  var r = zufall(9);
  var kanteMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(LILA).multiplyScalar(1.6), toneMapped: false });
  var saeuleMat = new THREE.MeshPhysicalMaterial({ color: 0x08080C, metalness: .6, roughness: .3, envMapIntensity: .3, clearcoat: .6 });
  for (var x = -16; x < 130; x += 3.2 + r() * 2.4){
    for (var reihe = 0; reihe < 2; reihe++){
      if (r() < .3) continue;
      var z = -21 - reihe * 7 - r() * 3, hoehe = 2.5 + r() * (reihe ? 9 : 5), breite = .6 + r() * .9;
      var s = teil(rund(breite, hoehe, breite, .05), saeuleMat, x + r() * 1.5, hoehe / 2, z, false);
      if (r() < .6) teil(new THREE.BoxGeometry(breite * .9, .025, .025), kanteMat, s.position.x, hoehe - .25 - r() * hoehe * .5, z + breite / 2 + .02, false);
      teil(new THREE.BoxGeometry(.02, hoehe * .8, .02), kanteMat, s.position.x - breite / 2 - .005, hoehe * .45, z + breite / 2 + .005, false).visible = r() < .35;
    }
  }
})();

/* schwebende Lichtpartikel fuer Tiefe */
var STAUB = 900, staubPos = new Float32Array(STAUB * 3), staubBasis = [];
(function(){
  var r = zufall(21);
  for (var i = 0; i < STAUB; i++){
    staubBasis.push([-12 + r() * 140, .3 + r() * 9, -16 + r() * 26, r() * 6.28, .3 + r() * .7]);
  }
  var c = document.createElement("canvas"); c.width = c.height = 64;
  var g = c.getContext("2d"), v = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  v.addColorStop(0, "rgba(255,255,255,1)"); v.addColorStop(.3, "rgba(200,180,255,.6)"); v.addColorStop(1, "rgba(140,92,246,0)");
  g.fillStyle = v; g.fillRect(0, 0, 64, 64);
  var geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(staubPos, 3));
  var p = new THREE.Points(geo, new THREE.PointsMaterial({ size: .09, map: new THREE.CanvasTexture(c), transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending, color: 0xC9B8FF, opacity: .75 }));
  szene.add(p); window.__staub = p;
})();
function staub(b){
  for (var i = 0; i < STAUB; i++){
    var s = staubBasis[i];
    staubPos[i * 3] = s[0] + Math.sin(b * .006 * s[4] + s[3]) * .6;
    staubPos[i * 3 + 1] = s[1] + Math.sin(b * .011 * s[4] + s[3] * 2) * .35;
    staubPos[i * 3 + 2] = s[2] + Math.cos(b * .007 * s[4] + s[3]) * .5;
  }
  window.__staub.geometry.attributes.position.needsUpdate = true;
}

/* ---------- Leuchtender Punkt ---------- */
function hofTextur(){
  var c = document.createElement("canvas"); c.width = c.height = 128;
  var g = c.getContext("2d"), v = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  v.addColorStop(0, "rgba(183,155,255,.75)"); v.addColorStop(.5, "rgba(139,92,246,.22)"); v.addColorStop(1, "rgba(139,92,246,0)");
  g.fillStyle = v; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
var HOF = hofTextur();
function punkt(){
  var gr = new THREE.Group();
  var kern = new THREE.Mesh(new THREE.SphereGeometry(.15, 32, 20), LEUCHT_WEISS.clone());
  var ring = new THREE.Mesh(new THREE.TorusGeometry(.24, .025, 12, 48), LEUCHT_LILA);
  var hof = new THREE.Sprite(new THREE.SpriteMaterial({ map: HOF, depthWrite: false, transparent: true, blending: THREE.AdditiveBlending }));
  gr.add(kern); gr.add(ring); gr.add(hof);
  gr.userData = { hof: hof, kern: kern, ring: ring };
  szene.add(gr); return gr;
}
function pulsiere(p, b, groesse){
  var t = (b % 36) / 36;
  p.userData.hof.scale.setScalar((groesse || 1) * (.9 + t * 1.8));
  p.userData.hof.material.opacity = 1 - t;
  p.userData.ring.lookAt(kamera.position);
}

/* ---------- Muenze ---------- */
function muenzTextur(drehung){
  var c = document.createElement("canvas"); c.width = c.height = 512;
  var g = c.getContext("2d");
  var v = g.createLinearGradient(60, 40, 450, 480);
  v.addColorStop(0, "#FFFFFF"); v.addColorStop(.35, "#D5D8E0"); v.addColorStop(.6, "#8E92A0"); v.addColorStop(1, "#E9EBF0");
  g.fillStyle = v; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = "rgba(40,40,52,.55)"; g.lineWidth = 10; g.beginPath(); g.arc(256, 256, 216, 0, Math.PI * 2); g.stroke();
  g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 3; g.beginPath(); g.arc(256, 256, 203, 0, Math.PI * 2); g.stroke();
  [[170, 300, 250, 330, 220], [240, 250, 200, 290, 170], [310, 190, 140, 230, 110]].forEach(function(k){
    g.fillStyle = "#23232D"; g.fillRect(k[0] - 4, k[4], 8, k[3] - k[4] + 30);
    g.fillRect(k[0] - 22, k[2], 44, k[1] - k[2] + 40);
  });
  g.strokeStyle = "#7C3AED"; g.lineWidth = 16; g.lineCap = "round"; g.lineJoin = "round";
  g.beginPath(); g.moveTo(140, 370); g.lineTo(240, 300); g.lineTo(290, 330); g.lineTo(380, 220); g.stroke();
  g.beginPath(); g.moveTo(330, 216); g.lineTo(384, 214); g.lineTo(380, 268); g.stroke();
  var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.center.set(.5, .5); t.rotation = drehung;   /* Kappen der Walze liegen quer */
  return t;
}
var MUENZ_TEX = muenzTextur(Math.PI / 2), MUENZ_TEX_HINTEN = muenzTextur(Math.PI / 2);
function muenze(x, y, z){
  var gr = new THREE.Group(); gr.position.set(x, y, z);
  var vorn = new THREE.MeshStandardMaterial({ map: MUENZ_TEX, metalness: .75, roughness: .28, envMapIntensity: 1.4 });
  var hinten = vorn.clone(); hinten.map = MUENZ_TEX_HINTEN;
  var m = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, .16, 96), [CHROM, vorn, hinten]);
  m.rotation.x = Math.PI / 2; m.castShadow = true; gr.add(m);
  szene.add(gr); return gr;
}
function plattform(x, z, radius){
  radius = radius || 2.3;
  var gr = new THREE.Group(); gr.position.set(x, 0, z);
  var p = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius + .1, .24, 96), SCHWARZ_GLANZ);
  p.position.y = .12; p.receiveShadow = true; p.castShadow = true; gr.add(p);
  var ring = new THREE.Mesh(new THREE.TorusGeometry(radius, .022, 8, 128), LEUCHT_LILA);
  ring.rotation.x = Math.PI / 2; ring.position.y = .245; gr.add(ring);
  var welle = new THREE.Mesh(new THREE.RingGeometry(.92, 1, 96), new THREE.MeshBasicMaterial({ color: LILA_HELL, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending }));
  welle.rotation.x = -Math.PI / 2; welle.position.y = .25; gr.add(welle);
  gr.userData.welle = welle;
  szene.add(gr); return gr;
}
var platt1 = plattform(0, 0), muenze1 = muenze(0, 1.55, 0);

/* ---------- Kerzen: Chrom steigt, Lila faellt ---------- */
function kerzen(daten, x0, abstand, y0, mass, basis, breite){
  breite = breite || .82;
  return daten.map(function(k, i){
    var o = k[0], c = k[1], hoch = k[2], tief = k[3], steigt = c >= o;
    var y = function(p){ return y0 + (p - basis) * mass; };
    var gr = new THREE.Group(); gr.position.set(x0 + i * abstand, 0, 0);
    var kh = Math.max(.1, Math.abs(y(c) - y(o)));
    var mat = steigt ? CHROM : LILA_MAT;
    var koerper = new THREE.Mesh(rund(breite, kh, breite, .09), mat);
    koerper.position.y = (y(c) + y(o)) / 2; koerper.castShadow = true;
    var docht = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, y(hoch) - y(tief), 16), mat);
    docht.position.y = (y(hoch) + y(tief)) / 2; docht.castShadow = true;
    gr.add(koerper); gr.add(docht); szene.add(gr);
    gr.userData = { mitte: (y(hoch) + y(tief)) / 2, y: y, k: k };
    return gr;
  });
}
function wachsen(kz, b, start, takt){
  kz.forEach(function(g, i){
    var t = feder(sp(b, start + i * takt, start + i * takt + 14));
    var m = g.userData.mitte;
    g.scale.set(1, Math.max(.001, t), 1);
    g.position.y = m * (1 - t);
    g.visible = t > .001;
  });
}
var C1 = [[104,102,105,101],[102,105,106,101.5],[105,107,108,104],[107,104.5,107.5,103.5],[104.5,103,105,102],
          [103,108,110,101.5],[108,109.5,110.5,107],[109.5,106.5,110,106],[106.5,108,109,105.5],[108,111,112,107.5],[111,109,111.5,108]];
var kerzen1 = kerzen(C1, 10, 1.6, .7, .3, 100);
