<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BENGX KI</title>
<style>
:root {
  --bg: #ffffff; --fg: #0a0a0a; --muted: #6e6e6e; --faint: #a3a3a3;
  --line: #e9e9e9; --soft: #f6f6f6; --hover: #f0f0f0;
  --inv-bg: #0a0a0a; --inv-fg: #ffffff;
  --radius: 14px;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a; --fg: #f5f5f5; --muted: #8c8c8c; --faint: #5c5c5c;
    --line: #232323; --soft: #141414; --hover: #1b1b1b;
    --inv-bg: #f5f5f5; --inv-fg: #0a0a0a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a0a; --fg: #f5f5f5; --muted: #8c8c8c; --faint: #5c5c5c;
  --line: #232323; --soft: #141414; --hover: #1b1b1b;
  --inv-bg: #f5f5f5; --inv-fg: #0a0a0a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans);
       -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 13px; }

/* ---------- Gerüst ---------- */
.app { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }
.seite { border-right: 1px solid var(--line); padding: 20px 14px; display: flex;
         flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.marke { display: flex; align-items: baseline; gap: 6px; padding: 4px 10px;
         font-weight: 750; letter-spacing: .14em; font-size: 15px; }
.marke span { font-weight: 400; letter-spacing: .04em; color: var(--muted); }
nav { display: flex; flex-direction: column; gap: 2px; }
.nav-titel { font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
             color: var(--faint); padding: 14px 10px 6px; }
nav a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 9px;
        color: var(--muted); text-decoration: none; font-size: 14px; }
nav a svg { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none;
            stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
nav a:hover { background: var(--hover); color: var(--fg); }
nav a.aktiv { background: var(--soft); color: var(--fg); font-weight: 560; }
nav a .zahl { margin-left: auto; font-size: 12px; color: var(--faint); }
.unten { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.token-karte { border: 1px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; }
.token-karte:hover { background: var(--hover); }
.token-karte .gross { font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
.token-karte .klein { font-size: 12px; color: var(--muted); }
.leiste { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 10px 0 6px; }
.leiste i { display: block; height: 100%; background: var(--fg); border-radius: 4px; }
.thema { display: flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.thema button { flex: 1; border: 0; background: none; padding: 5px; border-radius: 7px;
                font-size: 12px; color: var(--muted); cursor: pointer; }
.thema button.an { background: var(--soft); color: var(--fg); }

main { min-width: 0; padding: 34px 44px 80px; max-width: 1120px; }
.kopf { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
        margin-bottom: 28px; }
h1 { font-size: 28px; line-height: 1.2; letter-spacing: -.025em; margin: 0; font-weight: 680; }
.unter { color: var(--muted); margin: 6px 0 0; font-size: 14px; }
.pille { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line);
         border-radius: 999px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.pille i { width: 7px; height: 7px; border-radius: 50%; background: var(--fg); }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted);
     font-weight: 600; margin: 0 0 14px; }

/* ---------- Bausteine ---------- */
.raster { display: grid; gap: 16px; }
.r2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.r3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.r4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.karte { border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.karte + .karte, .raster + .karte, .karte + .raster, .raster + .raster { margin-top: 16px; }
.raster > .karte { margin-top: 0; }
.wert { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin-top: 2px; }
.etikett { font-size: 12.5px; color: var(--muted); }
.knopf { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px;
         padding: 0 16px; border-radius: 10px; border: 1px solid var(--fg); background: var(--inv-bg);
         color: var(--inv-fg); font-weight: 560; font-size: 14px; cursor: pointer; white-space: nowrap; }
.knopf:hover { opacity: .86; }
.knopf:disabled { opacity: .4; cursor: default; }
.knopf.hell { background: transparent; color: var(--fg); border-color: var(--line); }
.knopf.hell:hover { background: var(--hover); opacity: 1; }
.knopf small { font-weight: 400; opacity: .65; font-size: 12.5px; }
.zeile { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.zeile.weit { justify-content: space-between; }
.leer { color: var(--muted); padding: 28px 0; text-align: center; font-size: 14px; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px;
        padding: 4px 11px; font-size: 12.5px; color: var(--muted); background: none; cursor: pointer; }
.chip.an { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
.marke-klein { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px;
               border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.marke-klein.voll { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 0 12px 10px 0;
     border-bottom: 1px solid var(--line); }
td { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; padding-right: 0; }
.tabelle { overflow-x: auto; }
.rechtsblock { text-align: right; }

.balken { display: grid; grid-template-columns: 92px 1fr 64px; white-space: nowrap; align-items: center; gap: 12px;
          margin: 10px 0; font-size: 14px; }
.spur { height: 8px; background: var(--soft); border-radius: 8px; overflow: hidden; }
.spur i { display: block; height: 100%; background: var(--fg); border-radius: 8px; }
.balken.blass .spur i { background: var(--faint); }
.urteil { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }

.liste-eintrag { display: grid; grid-template-columns: 34px 1fr auto; gap: 14px; align-items: center;
                 padding: 13px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.liste-eintrag:last-child { border-bottom: 0; }
.liste-eintrag:hover { background: var(--hover); }
.symbol { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
          display: grid; place-items: center; }
.symbol svg { width: 16px; height: 16px; stroke: var(--fg); fill: none; stroke-width: 1.6;
              stroke-linecap: round; stroke-linejoin: round; }
.liste-eintrag .titel { font-weight: 560; font-size: 14px; }
.liste-eintrag .kurz { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden;
                       text-overflow: ellipsis; }
.liste-eintrag .rechts { text-align: right; font-size: 12.5px; color: var(--muted); white-space: nowrap; }

.konsole { background: var(--inv-bg); color: var(--inv-fg); border-radius: 12px; padding: 16px;
           font-family: var(--mono); font-size: 12.5px; line-height: 1.65; max-height: 340px;
           overflow: auto; white-space: pre-wrap; }
.konsole:empty::before { content: "Noch kein Training in dieser Sitzung."; opacity: .5; }

.detail { position: fixed; inset: 0; background: rgba(0,0,0,.28); display: none; z-index: 20; }
.detail.offen { display: block; }
.detail .blatt { position: absolute; right: 0; top: 0; bottom: 0; width: min(620px, 100%);
                 background: var(--bg); border-left: 1px solid var(--line); padding: 28px;
                 overflow-y: auto; }
.x { border: 1px solid var(--line); background: none; border-radius: 9px; width: 34px; height: 34px;
     cursor: pointer; font-size: 18px; line-height: 1; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
         background: var(--inv-bg); color: var(--inv-fg); padding: 11px 18px; border-radius: 11px;
         font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 30;
         max-width: calc(100% - 32px); }
.toast.zeigen { opacity: 1; transform: translateX(-50%); }
.hinweis { font-size: 12.5px; color: var(--muted); margin-top: 18px; }
.lade { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor;
        border-right-color: transparent; border-radius: 50%; animation: dreh .7s linear infinite; }
@keyframes dreh { to { transform: rotate(360deg); } }
svg.kurve { width: 100%; height: 220px; display: block; }
.feld { height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px;
        background: var(--bg); width: 140px; }
.abo.aktuell { border-color: var(--fg); }
dl.paare { display: grid; grid-template-columns: auto 1fr; gap: 9px 18px; margin: 0; font-size: 14px; }
dl.paare dt { color: var(--muted); }
dl.paare dd { margin: 0; }

/* ---------- Telefon ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .seite { min-width: 0; position: sticky; top: 0; height: auto; z-index: 10; background: var(--bg);
           border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; gap: 10px; }
  .seite .marke { padding: 0; }
  nav { flex-direction: row; overflow-x: auto; gap: 4px; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  .nav-titel { display: none; }
  nav a { flex: none; padding: 6px 10px; }
  nav a .zahl { display: none; }
  .unten { display: none; }
  main { padding: 22px 16px 60px; }
  .r2, .r3, .r4 { grid-template-columns: 1fr 1fr; }
  .r2.immer-voll, .r3.immer-voll { grid-template-columns: 1fr; }
  h1 { font-size: 24px; }
  .urteil { font-size: 28px; }
  .balken { grid-template-columns: 76px 1fr 60px; gap: 10px; }
}
@media (max-width: 520px) {
  .r2, .r3 { grid-template-columns: 1fr; }
  .r3.drei { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .r3.drei .wert { font-size: 17px !important; }
  .aktionen .karte { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
  .aktionen .karte > div:nth-child(2) { margin-top: 0 !important; }
  .aktionen .karte .kosten { margin: 0 0 0 auto !important; white-space: nowrap; }
  .aktionen .karte .u { display: none; }
  .kopf { flex-direction: column; }
  .rechtsblock { text-align: left; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="seite">
    <div class="marke">BENGX <span>KI</span></div>
    <nav id="nav"></nav>
    <div class="unten">
      <div class="token-karte" onclick="geh('konto')">
        <div class="klein">Tokens</div>
        <div class="gross num" id="sb-tokens">–</div>
        <div class="leiste"><i id="sb-leiste" style="width:0"></i></div>
        <div class="klein" id="sb-abo">–</div>
      </div>
      <div class="thema" id="thema">
        <button data-t="light">Hell</button><button data-t="auto">Auto</button><button data-t="dark">Dunkel</button>
      </div>
    </div>
  </aside>
  <main id="haupt"></main>
</div>
<div class="detail" id="detail" onclick="if(event.target===this)zu()"><div class="blatt" id="blatt"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const ICON = {
  uebersicht: '<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
  analyse: '<path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
  indikatoren: '<path d="M3 17l5-6 4 4 8-9"/><path d="M3 21h18"/>',
  strategie: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  training: '<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>',
  verlauf: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  modell: '<rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/>',
  konto: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1 1.3-1.8 3-1.8s3 .8 3 2-1.3 1.7-3 2.1-3 1-3 2.2 1.3 2 3 2 3-.8 3-1.8"/>',
  aufladung: '<path d="M12 5v14M5 12h14"/>',
};
const SEITEN = [
  ["uebersicht", "Übersicht"],
  ["#KI"],
  ["analyse", "Analyse"], ["indikatoren", "Indikatoren"], ["strategie", "Strategie"],
  ["#Daten"],
  ["verlauf", "Verlauf"], ["modell", "Modell"], ["konto", "Tokens & Abo"],
];
const icon = n => `<svg viewBox="0 0 24 24">${ICON[n] || ICON.verlauf}</svg>`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const zahl = (x, n = 2) => x == null ? "–" : Number(x).toLocaleString("de-DE", {minimumFractionDigits: n, maximumFractionDigits: n});
const ganz = x => x == null ? "–" : Number(x).toLocaleString("de-DE");
const pz = (x, n = 0) => x == null ? "–" : (x * 100).toLocaleString("de-DE", {minimumFractionDigits: n, maximumFractionDigits: n}) + " %";
const rr = x => x == null ? "–" : (x >= 0 ? "+" : "−") + zahl(Math.abs(x), 1) + " R";
const zeit = s => s ? new Date(s).toLocaleString("de-DE", {day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit"}) : "–";
const datum = s => s ? new Date(s).toLocaleDateString("de-DE") : "–";
const BEREICH = {analyse: "Analyse", indikatoren: "Indikatoren", strategie: "Strategie", training: "Training"};

let STAND = null;
let seite = "uebersicht";

/* ---------- Netz ---------- */
async function api(pfad, body) {
  const r = await fetch(pfad, body === undefined ? {} :
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({fehler: "Keine Antwort vom Server."}));
  if (!r.ok) throw Object.assign(new Error(d.fehler || "Fehler"), d);
  return d;
}
function toast(text) {
  const t = $("#toast"); t.textContent = text; t.classList.add("zeigen");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("zeigen"), 3800);
}
async function laden() {
  STAND = await api("/api/stand");
  const k = STAND.konto;
  $("#sb-tokens").textContent = ganz(k.gesamt);
  $("#sb-leiste").style.width = Math.min(100, 100 * k.abo_rest / Math.max(1, k.abo_monat)) + "%";
  $("#sb-abo").textContent = `${k.abo_name} · ${ganz(k.abo_rest)} von ${ganz(k.abo_monat)} im Monat`;
  navZeichnen();
}

/* ---------- Navigation ---------- */
function navZeichnen() {
  const z = STAND ? STAND.zaehler : {};
  $("#nav").innerHTML = SEITEN.map(([id, name]) => id.startsWith("#")
    ? `<div class="nav-titel">${id.slice(1)}</div>`
    : `<a href="#${id}" class="${id === seite ? "aktiv" : ""}">${icon(id)}${name}${
        z[id] ? `<span class="zahl">${z[id]}</span>` : id === "verlauf" && STAND ? `<span class="zahl">${Object.values(z).reduce((a, b) => a + b, 0) || ""}</span>` : ""}</a>`).join("");
}
function geh(id) { location.hash = id; }
window.addEventListener("hashchange", zeigen);

async function zeigen() {
  seite = (location.hash.slice(1) || "uebersicht");
  if (!SEITEN.some(([id]) => id === seite)) seite = "uebersicht";
  navZeichnen();
  window.scrollTo(0, 0);
  try { await (ANSICHT[seite])(); }
  catch (e) { $("#haupt").innerHTML = kopf("Fehler", e.message); }
}
const kopf = (titel, unter = "", rechts = "") => `<div class="kopf"><div><h1>${titel}</h1>${unter ? `<p class="unter">${unter}</p>` : ""}</div>${rechts}</div>`;
const tokenPille = () => STAND ? `<span class="pille num"><i></i>${ganz(STAND.konto.gesamt)} Tokens</span>` : "";
const kosten = a => STAND ? STAND.konto.kosten[a] : "?";
const tok = n => `${ganz(n)} ${n === 1 ? "Token" : "Tokens"}`;

/* ---------- Aktionen ---------- */
async function ausfuehren(knopf, pfad, body, danach) {
  const alt = knopf.innerHTML;
  knopf.disabled = true; knopf.innerHTML = '<span class="lade"></span> Läuft …';
  try {
    const e = await api(pfad, body || {});
    await laden();
    danach(e);
  } catch (err) {
    toast(err.message);
    if (err.tokens) setTimeout(() => geh("konto"), 1200);
  } finally { knopf.disabled = false; knopf.innerHTML = alt; }
}

/* ---------- Darstellungen ---------- */
function zeigeAnalyse(d) {
  const p = d.wahrscheinlichkeiten, i = d.idee;
  const urteil = i ? (i.richtung === "kaufen" ? "Kaufen" : "Verkaufen") : "Kein Signal";
  const max = Math.max(...Object.values(p));
  return `
    <div class="zeile weit"><div>
      <div class="etikett">Einschätzung für die Kerze vom ${zeit(d.kerze)}</div>
      <div class="urteil" style="margin-top:6px">${urteil}</div>
    </div><div class="rechtsblock"><div class="etikett">Schluss</div><div class="wert num">${zahl(d.schluss)}</div></div></div>
    <div style="margin-top:18px">${["hoch", "seitwärts", "runter"].map(k => `
      <div class="balken ${p[k] === max ? "" : "blass"}"><span>${k[0].toUpperCase() + k.slice(1)}</span>
      <div class="spur"><i style="width:${(p[k] * 100).toFixed(1)}%"></i></div><span class="num r" style="text-align:right">${pz(p[k], 1)}</span></div>`).join("")}
    </div>
    ${i ? `<div class="raster r3 drei" style="margin-top:18px">
      <div><div class="etikett">Einstieg</div><div class="wert num" style="font-size:20px">${zahl(i.einstieg)}</div></div>
      <div><div class="etikett">Stop</div><div class="wert num" style="font-size:20px">${zahl(i.stop)}</div></div>
      <div><div class="etikett">Ziel</div><div class="wert num" style="font-size:20px">${zahl(i.ziel)}</div></div></div>`
      : `<p class="etikett" style="margin-top:14px">Weder hoch noch runter erreicht ${pz(d.schwelle)} Sicherheit. Die KI hält sich zurück.</p>`}
    <p class="hinweis">Stop und Ziel je ${zahl(d.abstand)} entfernt · Blick ${d.horizont} Kerzen nach vorn · Schwelle ${pz(d.schwelle)}</p>`;
}

function kurve(v) {
  const W = 800, H = 220, P = 6;
  const alle = [...v.schluss, ...v.ema50, ...v.ema200].filter(x => x != null);
  const lo = Math.min(...alle), hi = Math.max(...alle), n = v.schluss.length;
  const X = i => P + i * (W - 2 * P) / (n - 1), Y = y => H - P - (y - lo) * (H - 2 * P) / ((hi - lo) || 1);
  const linie = r => r.map((y, i) => y == null ? "" : `${X(i).toFixed(1)},${Y(y).toFixed(1)}`).filter(Boolean).join(" ");
  return `<svg class="kurve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${linie(v.ema200)}" fill="none" stroke="var(--faint)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
    <polyline points="${linie(v.ema50)}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
    <polyline points="${linie(v.schluss)}" fill="none" stroke="var(--fg)" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="zeile etikett" style="gap:18px;margin-top:8px">
    <span>━ Kurs</span><span>┅ EMA 50</span><span style="color:var(--faint)">━ EMA 200</span>
    <span style="margin-left:auto">${datum(v.zeit[0])} – ${datum(v.zeit[n - 1])}</span></div>`;
}

function zeigeIndikatoren(d) {
  return `<div class="zeile weit" style="margin-bottom:14px"><div><div class="etikett">Gesamtbild</div>
      <div class="urteil" style="font-size:26px;margin-top:4px">${esc(d.gesamt)}</div></div></div>
    ${kurve(d.verlauf)}
    <div class="tabelle" style="margin-top:20px"><table><thead><tr><th>Indikator</th><th class="r">Wert</th><th>Deutung</th></tr></thead><tbody>
    ${d.liste.map(x => `<tr><td>${esc(x.name)}</td><td class="r num">${zahl(x.wert)}</td><td style="color:var(--muted)">${esc(x.deutung)}</td></tr>`).join("")}
    </tbody></table></div>`;
}

function zeigeKennzahlen(d) {
  return `<div class="raster r3">
      <div><div class="etikett">KI richtig</div><div class="wert num">${pz(d.treffer, 1)}</div></div>
      <div><div class="etikett">Raten („${esc(d.raten_klasse)}“)</div><div class="wert num" style="color:var(--muted)">${pz(d.raten, 1)}</div></div>
      <div><div class="etikett">Geprüfte Kerzen</div><div class="wert num">${ganz(d.kerzen)}</div></div></div>
    <div class="tabelle" style="margin-top:22px"><table><thead><tr><th>Handeln ab Sicherheit</th><th class="r">Trades</th><th class="r">Treffer</th><th class="r">Summe</th><th class="r">je Trade</th><th class="r">Einbruch</th></tr></thead><tbody>
    ${d.schwellen.map(s => `<tr><td>${pz(s.schwelle)}</td><td class="r num">${ganz(s.trades)}</td><td class="r num">${s.trades ? pz(s.treffer, 1) : "–"}</td><td class="r num"><b>${s.trades ? rr(s.summe_r) : "–"}</b></td><td class="r num">${s.trades ? (s.schnitt_r >= 0 ? "+" : "−") + zahl(Math.abs(s.schnitt_r), 3) : "–"}</td><td class="r num">${s.trades ? rr(s.einbruch_r) : "–"}</td></tr>`).join("")}
    <tr><td style="color:var(--muted)">Vergleich: immer kaufen</td><td class="r num">${ganz(d.immer_kaufen.trades)}</td><td class="r num">${pz(d.immer_kaufen.treffer, 1)}</td><td class="r num">${rr(d.immer_kaufen.summe_r)}</td><td class="r num">${(d.immer_kaufen.schnitt_r >= 0 ? "+" : "−") + zahl(Math.abs(d.immer_kaufen.schnitt_r), 3)}</td><td class="r num">${rr(d.immer_kaufen.einbruch_r)}</td></tr>
    </tbody></table></div>
    <div class="tabelle" style="margin-top:22px"><table><thead><tr><th>Wenn die KI sagt …</th><th class="r">so oft</th><th class="r">stimmt es</th></tr></thead><tbody>
    ${d.klassen.map(k => `<tr><td>${esc(k.name)}</td><td class="r num">${ganz(k.gesagt)}</td><td class="r num">${k.stimmt == null ? "–" : pz(k.stimmt, 1)}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="hinweis">Nur Kerzen ab ${datum(d.ab)}, die die KI beim Lernen nie gesehen hat. Ohne Gebühren und Spread.</p>`;
}

function zeigeEintrag(e) {
  const d = e.daten;
  if (e.bereich === "analyse") return zeigeAnalyse(d);
  if (e.bereich === "indikatoren") return zeigeIndikatoren(d);
  if (e.bereich === "strategie") return zeigeKennzahlen(d);
  if (e.bereich === "training") return (d.treffer != null ? zeigeKennzahlen(d) : `<p>${esc(d.kurz)}</p>`)
    + `<h2 style="margin-top:26px">Protokoll</h2><div class="konsole">${esc((d.protokoll || []).join("\n"))}</div>`;
  return `<pre class="mono">${esc(JSON.stringify(d, null, 2))}</pre>`;
}

function eintragZeile(e) {
  return `<div class="liste-eintrag" onclick="detail('${e.id}')">
    <div class="symbol">${icon(e.bereich)}</div>
    <div style="min-width:0"><div class="titel">${esc(e.titel)}</div><div class="kurz">${esc(e.kurz)}</div></div>
    <div class="rechts"><div>${zeit(e.zeit)}</div><div class="num">${e.tokens ? "−" + tok(e.tokens) : ""}</div></div></div>`;
}

async function detail(id) {
  const e = await api("/api/verlauf/" + id);
  $("#blatt").innerHTML = `<div class="zeile weit" style="margin-bottom:22px;align-items:flex-start">
      <div><span class="marke-klein">${esc(BEREICH[e.bereich] || e.bereich)}</span>
      <h1 style="font-size:22px;margin-top:10px">${esc(e.titel)}</h1>
      <p class="unter">${zeit(e.zeit)}${e.tokens ? " · " + e.tokens + " Tokens" : ""} · #${esc(e.id)}</p></div>
      <button class="x" onclick="zu()">×</button></div>${zeigeEintrag(e)}`;
  $("#detail").classList.add("offen");
}
function zu() { $("#detail").classList.remove("offen"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") zu(); });

/* ---------- Seiten ---------- */
const ANSICHT = {
  async uebersicht() {
    await laden();
    const s = STAND, k = s.konto, m = s.modell, q = s.quelle;
    const gesamt = Object.values(s.zaehler).reduce((a, b) => a + b, 0);
    $("#haupt").innerHTML = kopf("Übersicht", "Alles, was deine KI weiß, kann und getan hat.", tokenPille()) + `
      <div class="raster r4">
        <div class="karte"><div class="etikett">Tokens</div><div class="wert num">${ganz(k.gesamt)}</div><div class="etikett">${esc(k.abo_name)} · neu am ${datum(k.auffuellung)}</div></div>
        <div class="karte"><div class="etikett">Modell</div><div class="wert">${m.vorhanden ? "Bereit" : "Leer"}</div><div class="etikett">${m.vorhanden ? "trainiert " + datum(m.erstellt) : "noch nicht trainiert"}</div></div>
        <div class="karte"><div class="etikett">Letzter Kurs</div><div class="wert num">${q.fehler ? "–" : zahl(q.schluss)}</div><div class="etikett">${q.fehler ? "keine Daten" : zeit(q.bis)}</div></div>
        <div class="karte"><div class="etikett">Aktionen</div><div class="wert num">${ganz(gesamt)}</div><div class="etikett">im Verlauf</div></div>
      </div>
      ${q.fehler ? `<div class="karte"><b>Keine Kursdaten.</b> <span class="etikett">${esc(q.fehler)}</span></div>` : ""}
      <div class="raster r3 aktionen">
        ${[["analyse", "Analyse", "Was die KI jetzt erwartet"], ["indikatoren", "Indikatoren", "EMA, RSI, ADX, ATR, Kanal"], ["strategie", "Strategie", "Testen und neu trainieren"]].map(([id, t, u]) => `
        <a class="karte" href="#${id}" style="text-decoration:none;color:inherit;display:block">
          <div class="symbol">${icon(id)}</div><div style="font-weight:600;margin-top:14px">${t}</div>
          <div class="etikett u">${u}</div><div class="etikett kosten" style="margin-top:10px">${tok(kosten(id))}</div></a>`).join("")}
      </div>
      <div class="raster r2 immer-voll">
        <div class="karte"><div class="zeile weit"><h2>Letzte Analyse</h2>${s.letzte_analyse ? `<span class="etikett">${zeit(s.letzte_analyse.zeit)}</span>` : ""}</div>
          ${s.letzte_analyse ? zeigeAnalyse(s.letzte_analyse.daten) : `<div class="leer">Noch keine Analyse.<br><br><a class="knopf" href="#analyse">Zur Analyse</a></div>`}</div>
        <div class="karte"><div class="zeile weit"><h2>Zuletzt</h2><a href="#verlauf" class="etikett" style="color:inherit">Alles ansehen →</a></div>

      </div>`;
  },

  async analyse() {
    await laden();
    const m = STAND.modell;
    $("#haupt").innerHTML = kopf("Analyse", "Die KI schaut auf die letzten Kerzen und schätzt, ob zuerst das Ziel oben oder der Stop unten kommt.", tokenPille()) + `
      <div class="karte"><div class="zeile weit">
        <div class="zeile"><span class="etikett">Handeln ab</span>
          ${[0.5, 0.6, 0.7].map(s => `<button class="chip ${s === 0.5 ? "an" : ""}" data-s="${s}">${pz(s)}</button>`).join("")}
          <span class="etikett">Sicherheit</span></div>
        <button class="knopf" id="los" ${m.vorhanden ? "" : "disabled"}>Analysieren <small>· ${tok(kosten("analyse"))}</small></button>
      </div>${m.vorhanden ? "" : `<p class="etikett">Noch kein Modell. Zuerst unter <a href="#strategie" style="color:inherit">Strategie</a> trainieren.</p>`}</div>
      <div class="karte" id="ergebnis">${STAND.letzte_analyse ? zeigeAnalyse(STAND.letzte_analyse.daten) : `<div class="leer">Noch keine Analyse.</div>`}</div>
      <div class="karte"><h2>Frühere Analysen</h2><div id="frueher"></div></div>`;
    let schwelle = 0.5;
    document.querySelectorAll("[data-s]").forEach(c => c.onclick = () => {
      schwelle = +c.dataset.s; document.querySelectorAll("[data-s]").forEach(x => x.classList.toggle("an", x === c)); });
    const frueher = async () => { const l = await api("/api/verlauf?bereich=analyse");
      $("#frueher").innerHTML = l.length ? l.slice(0, 30).map(eintragZeile).join("") : `<div class="leer">Noch keine.</div>`; };
    $("#los").onclick = e => ausfuehren(e.currentTarget, "/api/analyse", {schwelle}, r => {
      $("#ergebnis").innerHTML = zeigeAnalyse(r.daten); frueher(); });
    frueher();

  async indikatoren() {
    await laden();
    const l = STAND.letzte_indikatoren;
    $("#haupt").innerHTML = kopf("Indikatoren", "Die klassischen Werkzeuge des Bots auf den aktuellen Kerzen.", tokenPille()) + `
      <div class="karte"><div class="zeile weit"><span class="etikett">${l ? "Zuletzt gelesen " + zeit(l.zeit) : "Noch nicht gelesen"}</span>
        <button class="knopf" id="los">Neu lesen <small>· ${tok(kosten("indikatoren"))}</small></button></div></div>
      <div class="karte" id="ergebnis">${l ? zeigeIndikatoren(l.daten) : `<div class="leer">Einmal lesen, dann erscheinen hier Kurve und Werte.</div>`}</div>`;
    $("#los").onclick = e => ausfuehren(e.currentTarget, "/api/indikatoren", {}, r => { $("#ergebnis").innerHTML = zeigeIndikatoren(r.daten); });
  },

  async strategie() {
    await laden();
    const m = STAND.modell;
    const letzter = (await api("/api/verlauf?bereich=strategie"))[0];
    $("#haupt").innerHTML = kopf("Strategie", "Nach welchen Regeln die KI handelt, wie gut das auf unbekannten Kerzen war, und neu lernen.", tokenPille()) + `
      <div class="raster r2 immer-voll">
        <div class="karte"><h2>Regeln</h2>${m.vorhanden ? `<dl class="paare">
          <dt>Frage</dt><dd>Kommt zuerst das Ziel oben oder der Stop unten?</dd>
          <dt>Stop / Ziel</dt><dd>je ${zahl(m.abstand_atr, 1)} × ATR, also 1 : 1</dd>
          <dt>Zeit</dt><dd>höchstens ${m.horizont} Kerzen, sonst „seitwärts“</dd>
          <dt>Blick</dt><dd>die letzten ${m.plan.fenster} Kerzen</dd>
          <dt>Position</dt><dd>immer nur eine zur Zeit</dd></dl>` : `<div class="leer">Erst nach dem Training.</div>`}</div>
        <div class="karte"><h2>Testen</h2><p class="etikett" style="margin-top:0">Prüft die KI auf allen Kerzen nach ihrem Lernzeitraum${m.vorhanden ? " (ab " + datum(m.test_ab) + ")" : ""}. Nur dort ist das Ergebnis ehrlich.</p>
          <button class="knopf" id="test" ${m.vorhanden ? "" : "disabled"}>Strategie testen <small>· ${tok(kosten("strategie"))}</small></button></div>
      </div>
      <div class="karte" id="ergebnis">${letzter ? `<div class="zeile weit"><h2>Letzter Test</h2><span class="etikett">${zeit(letzter.zeit)}</span></div><div id="erg-inhalt"></div>`
        : m.ergebnis ? `<h2>Ergebnis aus dem Training</h2>${zeigeKennzahlen({...m.ergebnis, ab: m.test_ab})}` : `<div class="leer">Noch kein Test.</div>`}</div>
      <div class="karte"><div class="zeile weit"><div><h2 style="margin:0">Neu trainieren</h2>
          <p class="etikett" style="margin:6px 0 0">Lernt von vorn aus den aktuellen Kursdaten. Das alte Modell wird ersetzt.</p></div>
        <button class="knopf" id="train">Training starten <small>· ${tok(kosten("training"))}</small></button></div>
        <div class="konsole" id="log" style="margin-top:16px"></div></div>`;
    if (letzter) { const e = await api("/api/verlauf/" + letzter.id); $("#erg-inhalt").innerHTML = zeigeKennzahlen(e.daten); }
    $("#test").onclick = e => ausfuehren(e.currentTarget, "/api/strategie", {}, r => {
      $("#ergebnis").innerHTML = `<div class="zeile weit"><h2>Letzter Test</h2><span class="etikett">${zeit(r.zeit)}</span></div>` + zeigeKennzahlen(r.daten); });
    $("#train").onclick = e => ausfuehren(e.currentTarget, "/api/training", {}, () => beobachten());
    beobachten();
  },

  async verlauf() {
    await laden();
    let filter = ""; try { filter = sessionStorage.getItem("filter") || ""; } catch (_) {}
    $("#haupt").innerHTML = kopf("Verlauf", "Jede Aktion der KI, mit allen Details. Antippen zum Öffnen.", tokenPille()) + `
      <div class="zeile" style="margin-bottom:16px">${[["", "Alle"], ...Object.entries(BEREICH)].map(([id, n]) =>
        `<button class="chip ${id === filter ? "an" : ""}" data-f="${id}">${n}${id && STAND.zaehler[id] ? " · " + STAND.zaehler[id] : ""}</button>`).join("")}</div>

    document.querySelectorAll("[data-f]").forEach(c => c.onclick = () => {
      try { sessionStorage.setItem("filter", c.dataset.f); } catch (_) {} ANSICHT.verlauf(); });

    $("#liste").innerHTML = l.length ? l.map(eintragZeile).join("") : `<div class="leer">Noch nichts passiert.</div>`;
  },

  async modell() {
    await laden();
    const m = STAND.modell, q = STAND.quelle;
    $("#haupt").innerHTML = kopf("Modell", "Das Gehirn: ein Transformer, von Grund auf gebaut und nur aus deinen Daten gelernt.", tokenPille()) + (!m.vorhanden
      ? `<div class="karte"><div class="leer">Noch kein Modell.<br><br><a class="knopf" href="#strategie">Jetzt trainieren</a></div></div>` : `
      <div class="raster r4">
        <div class="karte"><div class="etikett">Gewichte</div><div class="wert num">${ganz(m.gewichte)}</div></div>

        <div class="karte"><div class="etikett">Aufmerksamkeits-Köpfe</div><div class="wert num">${m.plan.koepfe}</div></div>
        <div class="karte"><div class="etikett">Kerzen pro Blick</div><div class="wert num">${m.plan.fenster}</div></div></div>
      <div class="raster r2 immer-voll">

          <dt>Test ab</dt><dd>${datum(m.test_ab)}</dd><dt>Innere Breite</dt><dd>${m.plan.breite}</dd>
          <dt>Dropout</dt><dd>${pz(m.plan.vergessen)}</dd><dt>Antworten</dt><dd>runter · seitwärts · hoch</dd></dl></div>
        <div class="karte"><h2>Was sie pro Kerze sieht</h2><div class="zeile" style="gap:8px">${m.merkmale.map(x => `<span class="chip" style="cursor:default">${esc(x.replace("_", " "))}</span>`).join("")}</div>
          <p class="hinweis">Alles im Verhältnis zur ATR, nie in Dollar. So passt das Gelernte auch, wenn Gold auf einem ganz anderen Niveau steht.</p></div></div>
      ${m.ergebnis ? `<div class="karte"><h2>Prüfung nach dem Training</h2>${zeigeKennzahlen({...m.ergebnis, ab: m.test_ab})}</div>` : ""}`) + `

        ${q.fehler ? `<dt>Fehler</dt><dd>${esc(q.fehler)}</dd>` : `<dt>Kerzen</dt><dd class="num">${ganz(q.kerzen)}</dd><dt>Zeitraum</dt><dd>${datum(q.von)} – ${datum(q.bis)}</dd>`}</dl></div>`;
  },

  async konto() {
    await laden();
    const {stand: k, buchungen: b} = await api("/api/konto");
    $("#haupt").innerHTML = kopf("Tokens & Abo", "Jede Aktion der KI kostet Tokens. Das Abo füllt sie jeden Monat auf.", tokenPille()) + `
      <div class="raster r3">
        <div class="karte"><div class="etikett">Verfügbar</div><div class="wert num" style="font-size:34px">${ganz(k.gesamt)}</div><div class="etikett">Tokens</div></div>
        <div class="karte"><div class="etikett">Aus dem Abo</div><div class="wert num">${ganz(k.abo_rest)} <span class="etikett">/ ${ganz(k.abo_monat)}</span></div>
          <div class="leiste"><i style="width:${Math.min(100, 100 * k.abo_rest / Math.max(1, k.abo_monat))}%"></i></div><div class="etikett">neu am ${datum(k.auffuellung)}, Rest verfällt</div></div>
        <div class="karte"><div class="etikett">Extra</div><div class="wert num">${ganz(k.extra)}</div><div class="etikett">aufgeladen, verfällt nie</div></div></div>
      <h2 style="margin-top:34px">Abos</h2>
      <div class="raster r3">${Object.entries(k.abos).map(([id, a]) => `
        <div class="karte abo ${id === k.abo ? "aktuell" : ""}"><div class="zeile weit"><b>${esc(a.name)}</b>${id === k.abo ? `<span class="marke-klein voll">Aktuell</span>` : ""}</div>
          <div class="wert num" style="margin-top:12px">${ganz(a.tokens_monat)}</div><div class="etikett">Tokens im Monat</div>
          <p class="etikett" style="min-height:40px">${esc(a.text)}</p>
          <div class="zeile weit"><span class="etikett">${a.preis == null ? "Preis folgt" : esc(a.preis)}</span>
          ${id === k.abo ? "" : `<button class="knopf hell" data-abo="${id}">Wechseln</button>`}</div></div>`).join("")}</div>
      <div class="raster r2 immer-voll">
        <div class="karte"><h2>Was kostet was</h2><table><tbody>${Object.entries(k.kosten).map(([a, n]) =>
          `<tr><td>${esc(k.aktionen[a])}</td><td class="r num">${n} ${n === 1 ? "Token" : "Tokens"}</td></tr>`).join("")}</tbody></table>
          <p class="hinweis">Scheitert eine Aktion, kommen die Tokens zurück.</p></div>
        <div class="karte"><h2>Aufladen</h2><p class="etikett" style="margin-top:0">Nur für dich als Inhaber. Bezahlung für Abonnenten kommt später.</p>
          <div class="zeile"><input class="feld num" id="menge" type="number" min="1" value="500"><button class="knopf" id="auf">Aufladen</button></div></div></div>
      <div class="karte"><h2>Buchungen</h2>${b.length ? `<div class="tabelle"><table><thead><tr><th>Zeit</th><th>Vorgang</th><th class="r">Tokens</th><th class="r">Stand</th></tr></thead><tbody>
        ${b.map(x => `<tr><td class="num" style="color:var(--muted);white-space:nowrap">${zeit(x.zeit)}</td><td>${esc(x.text)}</td><td class="r num"><b>${x.menge > 0 ? "+" : "−"}${ganz(Math.abs(x.menge))}</b></td><td class="r num">${ganz(x.stand)}</td></tr>`).join("")}
        </tbody></table></div>` : `<div class="leer">Noch keine Buchungen.</div>`}</div>`;
    $("#auf").onclick = e => ausfuehren(e.currentTarget, "/api/konto/aufladen", {menge: +$("#menge").value}, () => { toast("Aufgeladen."); ANSICHT.konto(); });
    document.querySelectorAll("[data-abo]").forEach(x => x.onclick = e =>
      ausfuehren(e.currentTarget, "/api/konto/abo", {abo: x.dataset.abo}, () => { toast("Abo gewechselt."); ANSICHT.konto(); }));
  },
};

/* ---------- Training beobachten ---------- */
let beobachter = null;
async function beobachten() {
  clearTimeout(beobachter);
  const log = $("#log"); if (!log) return;
  const t = await api("/api/training");
  log.textContent = t.zeilen.join("\n");
  log.scrollTop = log.scrollHeight;
  const knopf = $("#train");
  if (t.status === "laeuft") {
    if (knopf) { knopf.disabled = true; knopf.innerHTML = '<span class="lade"></span> Lernt …'; }
    beobachter = setTimeout(beobachten, 1500);
  } else if (knopf && knopf.disabled && seite === "strategie") {
    toast(t.status === "fertig" ? "Training fertig." : "Training fehlgeschlagen.");
    ANSICHT.strategie();
  }
}

/* ---------- Thema ---------- */
function thema(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  document.querySelectorAll("#thema button").forEach(b => b.classList.toggle("an", b.dataset.t === t));
  try { localStorage.setItem("thema", t); } catch (_) {}
}
document.querySelectorAll("#thema button").forEach(b => b.onclick = () => thema(b.dataset.t));
let gespeichert = "auto"; try { gespeichert = localStorage.getItem("thema") || "auto"; } catch (_) {}
thema(gespeichert);

zeigen();
</script>
</body>
</html>
