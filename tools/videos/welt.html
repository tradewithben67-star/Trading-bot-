<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BENGX 3D-Welt</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  /* Die Buehne ist immer 540x960 gedacht (9:16). Aufgenommen wird mit
     doppelter Pixeldichte, also 1080x1920. Im Browser wird sie nur skaliert. */
  #buehne{position:relative;width:540px;height:960px;overflow:hidden;
    transform-origin:center center;background:#EEF1F5;
    font-family:Inter,"Inter Display",Arial,sans-serif;color:#1F2328}
  #buehne canvas{position:absolute;inset:0;display:block}
  .ebene{position:absolute;inset:0;pointer-events:none}

  .karte{position:absolute;left:26px;right:26px;top:96px;background:#fff;
    border-radius:20px;padding:18px 22px 19px;
    box-shadow:0 10px 30px rgba(20,30,50,.16),0 2px 6px rgba(20,30,50,.08);
    transform-origin:50% 0;opacity:0}
  .karte.mitte{top:auto;bottom:auto;top:50%;left:50%;right:auto;width:400px;
    margin-left:-222px;transform-origin:50% 50%;text-align:center;padding:24px 22px}
  .karte.unten{top:auto;bottom:206px;transform-origin:50% 100%}
  .karte .zeile{display:flex;align-items:center;gap:12px}
  .karte .symbol{flex:none;width:40px;height:40px;border-radius:12px;display:flex;
    align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px}
  .karte h2{margin:0;font-size:25px;line-height:1.15;font-weight:800;letter-spacing:-.4px}
  .karte p{margin:6px 0 0;font-size:16.5px;line-height:1.38;color:#4A525C}
  .karte .klein{font-size:13px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#1A73E8;margin-bottom:6px}
  .karte.titel h2{font-size:40px;letter-spacing:-1px}
  .legende{display:flex;flex-direction:column;gap:10px}
  .legende div{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600}
  .legende i{width:18px;height:30px;border-radius:5px;display:block;position:relative}
  .legende i:before{content:"";position:absolute;left:8px;top:-7px;bottom:-7px;width:2px;background:inherit;border-radius:2px}

  .tag{position:absolute;left:0;top:0;white-space:nowrap;background:#fff;border-radius:999px;
    padding:6px 12px 6px 10px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;
    box-shadow:0 4px 14px rgba(20,30,50,.18);opacity:0;transform-origin:0 50%}
  .tag b{width:9px;height:9px;border-radius:50%;display:block}

  #schluss{position:absolute;left:0;right:0;top:600px;text-align:center;opacity:0}
  #schluss .marke{font-size:64px;font-weight:800;letter-spacing:10px;color:#EFC45E;margin-left:10px}
  #schluss .satz{font-size:20px;color:#DCE1E8;margin-top:10px;font-weight:500}
  #schluss .hinweis{font-size:12.5px;color:#7D848D;margin-top:120px;letter-spacing:.4px}
  #blitz{position:absolute;inset:0;background:#D93025;opacity:0}
</style>
</head>
<body>
<div id="buehne">
  <div id="blitz" class="ebene"></div>
  <div id="karten" class="ebene"></div>
  <div id="tags" class="ebene"></div>
  <div id="schluss">
    <div class="marke">BENGX</div>
    <div class="satz">Trading verstehen. Schritt für Schritt.</div>
    <div class="hinweis">Nur zur Bildung · Keine Anlageberatung</div>
  </div>
</div>
<script src="vendor/three.min.js"></script>
<script>
/* Ein Erklaerfilm als 3D-Welt im Stil sauberer Karten-Animationen:
   helle Low-Poly-Stadt, eine durchgehende Kamerafahrt, Karten, die mit
   Feder ins Bild springen. Jedes Bild haengt allein an der Bildnummer
   (window.zeichne(b)), damit die Aufnahme sich Zeit lassen kann. */
(function(){
"use strict";
var B = 540, H = 960, FPS = 30, LAENGE = 960;   /* 32 Sekunden */
window.__laenge = LAENGE; window.__fps = FPS;

/* ---------- Farben ---------- */
var HIMMEL = new THREE.Color("#EEF1F5"), NACHT = new THREE.Color("#0B0C10");
var GRUEN = "#2FB673", ROT = "#E8574B", BLAU = "#1A73E8", GOLD = "#E9B949";
var BODEN = new THREE.Color("#F3F4F6"), BODEN_N = new THREE.Color("#111318");

/* ---------- Helfer ---------- */
function klemm(t){ return t < 0 ? 0 : t > 1 ? 1 : t; }
function sp(b, von, bis){ return klemm((b - von) / (bis - von)); }
function raus(t){ t = klemm(t); return 1 - Math.pow(1 - t, 3); }
function weich(t){ t = klemm(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }
function feder(t){ t = klemm(t); var s = 1.9, u = t - 1; return 1 + (s + 1)*u*u*u + s*u*u; }
function zufall(saat){ return function(){ saat |= 0; saat = saat + 0x6D2B79F5 | 0;
  var t = Math.imul(saat ^ saat >>> 15, 1 | saat); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function v(x, y, z){ return new THREE.Vector3(x, y, z); }

/* ---------- Renderer, Szene, Kamera ---------- */
var buehne = document.getElementById("buehne");
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
renderer.setSize(B, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
buehne.insertBefore(renderer.domElement, buehne.firstChild);

var szene = new THREE.Scene();
szene.background = HIMMEL.clone();
szene.fog = new THREE.Fog(HIMMEL.clone(), 28, 80);
var kamera = new THREE.PerspectiveCamera(42, B / H, 0.1, 300);

var himmelLicht = new THREE.HemisphereLight(0xffffff, 0xcfd5de, 1.55);
szene.add(himmelLicht);
var sonne = new THREE.DirectionalLight(0xffffff, 2.3);
sonne.castShadow = true;
sonne.shadow.mapSize.set(2048, 2048);
var sc = sonne.shadow.camera; sc.left = -16; sc.right = 16; sc.top = 16; sc.bottom = -16; sc.near = 1; sc.far = 70;
sonne.shadow.bias = -0.0006; sonne.shadow.radius = 4;
szene.add(sonne); szene.add(sonne.target);

function ton(farbe, extra){
  var m = new THREE.MeshStandardMaterial(Object.assign({ color: farbe, roughness: .88, metalness: 0, flatShading: true }, extra || {}));
  return m;
}
function teil(geo, mat, x, y, z, schatten){
  var m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = schatten !== false; m.receiveShadow = true; szene.add(m); return m;
}

/* ---------- Boden, Strassen, Stadt ---------- */
var bodenMat = ton(BODEN.getHex(), { flatShading: false });
var boden = new THREE.Mesh(new THREE.PlaneGeometry(400, 200), bodenMat);
boden.rotation.x = -Math.PI / 2; boden.position.set(55, 0, 0); boden.receiveShadow = true; szene.add(boden);

var strasseMat = ton(0xDDE1E7, { flatShading: false });
var strichMat = ton(0xffffff, { flatShading: false });
function strasse(x1, z1, x2, z2, breite){
  var lang = Math.hypot(x2 - x1, z2 - z1), w = Math.atan2(z2 - z1, x2 - x1);
  var s = new THREE.Mesh(new THREE.PlaneGeometry(lang, breite), strasseMat);
  s.rotation.x = -Math.PI / 2; s.rotation.z = -w; s.position.set((x1 + x2) / 2, .012, (z1 + z2) / 2);
  s.receiveShadow = true; szene.add(s);
  for (var d = 1; d < lang - 1; d += 2.2){
    var st = new THREE.Mesh(new THREE.PlaneGeometry(1.1, .12), strichMat);
    st.rotation.x = -Math.PI / 2; st.rotation.z = -w;
    st.position.set(x1 + Math.cos(w) * d, .02, z1 + Math.sin(w) * d); szene.add(st);
  }
}
strasse(-20, 6.2, 135, 6.2, 2.6);
[31, 47.5, 76, 90, 104].forEach(function(x){ strasse(x, -40, x, 5, 2.2); });

var r = zufall(7);
var hausFarben = [0xE6E1D8, 0xDDD8CE, 0xE9E6E0, 0xD9DDE3, 0xE4DDD2];
var baumMat = ton(0xA9D8AE), stammMat = ton(0xB7B2AA), fensterMat = ton(0xC9CED6);
function frei(x){ /* Strassen freihalten */
  return [31, 47.5, 76, 90, 104].every(function(s){ return Math.abs(x - s) > 2.2; });
}
for (var hx = -18; hx < 132; hx += 2.6){
  for (var reihe = 0; reihe < 4; reihe++){
    var x = hx + (r() - .5) * .8, z = -9 - reihe * 4.4 - r() * 1.2;
    if (!frei(x)) continue;
    if (r() < .28){
      var hoehe = .5 + r() * .5;
      teil(new THREE.CylinderGeometry(.06, .08, hoehe, 5), stammMat, x, hoehe / 2, z);
      teil(new THREE.IcosahedronGeometry(.75 + r() * .35, 0), baumMat, x, hoehe + .55, z);
      continue;
    }
    var bw = 1.4 + r() * .9, bt = 1.6 + r() * 1.4, bh = 1 + r() * (reihe === 0 ? 2.2 : 4.5);
    var haus = teil(new THREE.BoxGeometry(bw, bh, bt), ton(hausFarben[Math.floor(r() * hausFarben.length)]), x, bh / 2, z);
    for (var f = .55; f < bh - .3; f += .7){   /* Fensterbaender */
      teil(new THREE.BoxGeometry(bw * .78, .16, .02), fensterMat, x, f, z + bt / 2 + .011, false);
    }
    haus.rotation.y = 0;
  }
}
/* ein paar Baeume vorne an der Strasse, weit weg von den Szenen */
[-12, -6, 28.5, 33.5, 45, 50.5, 73.5, 78.5, 88, 92.5, 101, 107].forEach(function(x, i){
  var z = 8.4 + (i % 2) * .4;
  teil(new THREE.CylinderGeometry(.05, .07, .5, 5), stammMat, x, .25, z);
  teil(new THREE.IcosahedronGeometry(.55, 0), baumMat, x, .85, z);
});

/* ---------- Leuchtender Positionspunkt (wie bei Navigation) ---------- */
function hofTextur(){
  var c = document.createElement("canvas"); c.width = c.height = 128;
  var g = c.getContext("2d"), v = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  v.addColorStop(0, "rgba(26,115,232,.55)"); v.addColorStop(.55, "rgba(26,115,232,.18)"); v.addColorStop(1, "rgba(26,115,232,0)");
  g.fillStyle = v; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
var HOF = hofTextur();
function punkt(){
  var gr = new THREE.Group();
  var ring = new THREE.Mesh(new THREE.SphereGeometry(.2, 24, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .4 }));
  var kern = new THREE.Mesh(new THREE.SphereGeometry(.15, 24, 16), new THREE.MeshStandardMaterial({ color: BLAU, roughness: .35, emissive: BLAU, emissiveIntensity: .25 }));
  kern.position.z = .07; ring.castShadow = true;
  var hof = new THREE.Sprite(new THREE.SpriteMaterial({ map: HOF, depthWrite: false, transparent: true }));
  gr.add(ring); gr.add(kern); gr.add(hof);
  gr.userData = { hof: hof, kern: kern };
  szene.add(gr); return gr;
}
function pulsiere(p, b, groesse){
  var t = (b % 36) / 36;
  p.userData.hof.scale.setScalar((groesse || 1) * (.8 + t * 1.6));
  p.userData.hof.material.opacity = 1 - t;
}

/* ---------- Szene 1: Muenze auf der Plattform ---------- */
function muenzTextur(drehung){
  var c = document.createElement("canvas"); c.width = c.height = 512;
  var g = c.getContext("2d");
  var v = g.createRadialGradient(200, 180, 30, 256, 256, 280);
  v.addColorStop(0, "#FFE7A3"); v.addColorStop(.55, "#EFC45E"); v.addColorStop(1, "#B08E36");
  g.fillStyle = v; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = "rgba(120,86,20,.45)"; g.lineWidth = 14; g.beginPath(); g.arc(256, 256, 214, 0, Math.PI * 2); g.stroke();
  /* drei Kerzen und ein Pfeil: das Zeichen fuer Trading */
  var kz = [[170, 300, 250, 330, 220, "#8A6418"], [240, 250, 200, 290, 170, "#8A6418"], [310, 190, 140, 230, 110, "#8A6418"]];
  kz.forEach(function(k){
    g.fillStyle = k[5]; g.fillRect(k[0] - 4, k[4], 8, k[3] - k[4] + 30);
    g.fillRect(k[0] - 22, k[2], 44, k[1] - k[2] + 40);
  });
  g.strokeStyle = "#7A5610"; g.lineWidth = 16; g.lineCap = "round"; g.lineJoin = "round";
  g.beginPath(); g.moveTo(140, 370); g.lineTo(240, 300); g.lineTo(290, 330); g.lineTo(380, 220); g.stroke();
  g.beginPath(); g.moveTo(330, 216); g.lineTo(384, 214); g.lineTo(380, 268); g.stroke();
  var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.center.set(.5, .5); t.rotation = drehung;   /* Kappen der Walze liegen quer */
  return t;
}
var MUENZ_TEX = muenzTextur(Math.PI / 2), MUENZ_TEX_HINTEN = muenzTextur(Math.PI / 2);
function muenze(x, y, z){
  var gr = new THREE.Group(); gr.position.set(x, y, z);
  var rand = new THREE.MeshStandardMaterial({ color: 0xD9A93F, metalness: .7, roughness: .3 });
  var vorn = new THREE.MeshStandardMaterial({ map: MUENZ_TEX, emissiveMap: MUENZ_TEX, emissive: 0xffffff, emissiveIntensity: 0, metalness: .45, roughness: .35 });
  var hinten = vorn.clone(); hinten.map = hinten.emissiveMap = MUENZ_TEX_HINTEN;
  var m = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, .16, 64), [rand, vorn, hinten]);
  gr.userData.flaechen = [vorn, hinten];
  m.rotation.x = Math.PI / 2; m.castShadow = true; gr.add(m);
  szene.add(gr); return gr;
}
function plattform(x, z){
  var gr = new THREE.Group(); gr.position.set(x, 0, z);
  var p = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.45, .28, 48), ton(0xffffff, { flatShading: false }));
  p.position.y = .14; p.receiveShadow = true; p.castShadow = true; gr.add(p);
  var ring = new THREE.Mesh(new THREE.TorusGeometry(2.3, .035, 8, 64), new THREE.MeshStandardMaterial({ color: BLAU }));
  ring.rotation.x = Math.PI / 2; ring.position.y = .29; gr.add(ring);
  var welle = new THREE.Mesh(new THREE.RingGeometry(.9, 1, 64), new THREE.MeshBasicMaterial({ color: BLAU, transparent: true, depthWrite: false }));
  welle.rotation.x = -Math.PI / 2; welle.position.y = .3; gr.add(welle);
  gr.userData.welle = welle;
  szene.add(gr); return gr;
}
var platt1 = plattform(0, 0), muenze1 = muenze(0, 1.55, 0);

/* ---------- Kerzen ---------- */
var gruenMat = ton(GRUEN), rotMat = ton(ROT);
function kerzen(daten, x0, abstand, y0, mass, basis){
  return daten.map(function(k, i){
    var o = k[0], c = k[1], hoch = k[2], tief = k[3], steigt = c >= o;
    var y = function(p){ return y0 + (p - basis) * mass; };
    var gr = new THREE.Group(); gr.position.set(x0 + i * abstand, 0, 0);
    var kh = Math.max(.08, Math.abs(y(c) - y(o)));
    var koerper = new THREE.Mesh(new THREE.BoxGeometry(.86, kh, .86), steigt ? gruenMat : rotMat);
    koerper.position.y = (y(c) + y(o)) / 2; koerper.castShadow = true;
    var docht = new THREE.Mesh(new THREE.CylinderGeometry(.055, .055, y(hoch) - y(tief), 8), steigt ? gruenMat : rotMat);
    docht.position.y = (y(hoch) + y(tief)) / 2; docht.castShadow = true;
    gr.add(koerper); gr.add(docht); szene.add(gr);
    gr.userData = { mitte: (y(hoch) + y(tief)) / 2, y: y, k: k };
    return gr;
  });
}
function wachsen(kz, b, start, takt){
  kz.forEach(function(g, i){
    var t = feder(sp(b, start + i * takt, start + i * takt + 14));
    var m = g.userData.mitte;
    g.scale.set(1, Math.max(.001, t), 1);
    g.position.y = m * (1 - t);   /* waechst um die eigene Mitte */
    g.visible = t > .001;
  });
}
/* Szene 2: gemischter Chart, Kerze 5 wird erklaert */
var C1 = [[104,102,105,101],[102,105,106,101.5],[105,107,108,104],[107,104.5,107.5,103.5],[104.5,103,105,102],
          [103,108,110,101.5],[108,109.5,110.5,107],[109.5,106.5,110,106],[106.5,108,109,105.5],[108,111,112,107.5],[111,109,111.5,108]];
var kerzen1 = kerzen(C1, 10, 1.6, .7, .3, 100);
/* Szene 4: Aufwaertstrend */
var C2 = [[100,103,104,99],[103,106,107,102],[106,104,107,103],[104,102,105,101],[102,106,107,101.5],[106,110,111,105],
          [110,107,110.5,106],[107,105.5,108,105],[105.5,110,111,105],[110,114,115,109.5],[114,112,114.5,111],[112,117,118,111.5]];
var kerzen2 = kerzen(C2, 52, 1.15, .6, .22, 99);

/* ---------- Szene 3: Kaeufer gegen Verkaeufer ---------- */
var platz = new THREE.Mesh(new THREE.CircleGeometry(5.2, 64), ton(0xffffff, { flatShading: false }));
platz.rotation.x = -Math.PI / 2; platz.position.set(40, .015, 0); platz.receiveShadow = true; szene.add(platz);
function figur(x, z, mat){
  var gr = new THREE.Group(); gr.position.set(x, 0, z);
  var k = new THREE.Mesh(new THREE.CylinderGeometry(.13, .19, .5, 10), mat); k.position.y = .25; k.castShadow = true;
  var kopf = new THREE.Mesh(new THREE.SphereGeometry(.14, 14, 10), mat); kopf.position.y = .64; kopf.castShadow = true;
  gr.add(k); gr.add(kopf); gr.visible = false; szene.add(gr); return gr;
}
var kaeufer = [], verkaeufer = [];
(function(){
  var rr = zufall(3);
  for (var i = 0; i < 18; i++) kaeufer.push(figur(38.4 - (i % 4) * .55 - rr() * .12, -1.2 + Math.floor(i / 4) * .6 + rr() * .1, gruenMat));
  for (var j = 0; j < 8; j++) verkaeufer.push(figur(41.6 + (j % 4) * .55 + rr() * .12, -1.2 + Math.floor(j / 4) * .6 + rr() * .1, rotMat));
})();
var saeule = teil(new THREE.CylinderGeometry(.05, .05, 4.6, 8), ton(0xB9C0CA), 40, 2.3, -.2);
for (var s = 0; s < 9; s++) teil(new THREE.BoxGeometry(.22, .025, .025), ton(0xB9C0CA), 40, .6 + s * .5, -.2, false);
var preisPunkt = punkt();

/* ---------- Route (Linie, die sich zeichnet) ---------- */
function route(punkte, radius, farbe){
  var kurve = new THREE.CatmullRomCurve3(punkte, false, "centripetal");
  var geo = new THREE.TubeGeometry(kurve, 240, radius, 10, false);
  var m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: farbe, roughness: .35, emissive: farbe, emissiveIntensity: .15 }));
  m.castShadow = true; szene.add(m);
  m.userData = { kurve: kurve, ring: 10 };
  return m;
}
function zeichneRoute(m, t){
  m.geometry.setDrawRange(0, Math.floor(klemm(t) * 240) * m.userData.ring * 6);
  m.visible = t > 0;
}
var trendPunkte = [v(51.6, kerzen2[0].userData.y(100), .62)].concat(C2.map(function(k, i){ return v(52 + i * 1.15, kerzen2[i].userData.y(k[1]), .62); }));
var trend = route(trendPunkte, .065, BLAU), trendPunkt = punkt();

/* ---------- Szene 5: Long und Short ---------- */
function pfeil(mat, oben){
  var gr = new THREE.Group();
  var schaft = new THREE.Mesh(new THREE.BoxGeometry(.55, 2.2, .55), mat); schaft.castShadow = true;
  var spitze = new THREE.Mesh(new THREE.ConeGeometry(.75, 1.05, 4), mat); spitze.castShadow = true;
  spitze.rotation.y = Math.PI / 4;
  spitze.position.y = 1.6; gr.add(schaft); gr.add(spitze);
  if (!oben) gr.rotation.z = Math.PI;
  szene.add(gr); return gr;
}
var pLong = pfeil(gruenMat, true), pShort = pfeil(rotMat, false);
var sockel = teil(new THREE.CylinderGeometry(3.2, 3.3, .18, 48), ton(0xffffff, { flatShading: false }), 82, .09, 0);

/* ---------- Szene 6: Risiko ---------- */
function zone(y1, y2, farbe){
  var m = new THREE.Mesh(new THREE.BoxGeometry(7.4, y2 - y1, 1.2),
    new THREE.MeshStandardMaterial({ color: farbe, transparent: true, opacity: .26, roughness: .6, depthWrite: false }));
  m.position.set(95.3, (y1 + y2) / 2, 0); szene.add(m); return m;
}
var tpZone = zone(3.7, 4.3, GRUEN), slZone = zone(1.4, 1.9, ROT);
var einstieg = teil(new THREE.BoxGeometry(7.4, .035, .035), ton(0x5F6670), 95.3, 2.6, .62, false);
var risikoPfad = route([v(92.2, 2.6, .62), v(93.2, 3.05, .62), v(94.2, 2.85, .62), v(95.2, 3.3, .62), v(96.2, 2.55, .62), v(97.1, 1.9, .62)], .06, BLAU);
var risikoPunkt = punkt();

/* ---------- Schluss ---------- */
var muenze2 = muenze(112, 1.75, 0);
var goldLicht = new THREE.PointLight(0xFFE2A0, 0, 0, 2); goldLicht.position.set(112.6, 2.6, 2.2); szene.add(goldLicht);

/* ---------- Kamerafahrt ----------
   [Bild, Kameraposition, Blickpunkt, Art]  Art "f" = Flug (weich, mit Bogen),
   sonst ruhiges Gleiten. */
var KEYS = [
  [0,   v(3.0, 2.6, 6.2),   v(0, 1.2, 0)],
  [86,  v(-2.6, 3.2, 6.8),  v(0, 1.1, 0)],
  [122, v(7.5, 6.2, 13.5),  v(17, 2.1, 0), "f"],
  [205, v(10.5, 6.8, 14),   v(18.5, 2.2, 0)],

function kameraBei(b){
  var i = 0; while (i < KEYS.length - 2 && b >= KEYS[i + 1][0]) i++;
  var a = KEYS[i], z = KEYS[i + 1], t = sp(b, a[0], z[0]);
  var flug = z[3] === "f", e = flug ? weich(t) : t;
  var pos = a[1].clone().lerp(z[1], e), ziel = a[2].clone().lerp(z[2], e);
  if (flug) pos.y += Math.sin(Math.PI * e) * 2.2;   /* Bogen nach oben im Flug */
  return { pos: pos, ziel: ziel };
}

    var ziel = 52 + t.kerze * 1.15 - .1;
    for (var b = TREND_VON; b <= TREND_BIS; b++){
      if (trend.userData.kurve.getPointAt(Math.max(.0001, weich(sp(b, TREND_VON, TREND_BIS)))).x >= ziel){ t.von = b; break; }

function bildschirm(p){ hilf.copy(p).project(kamera); return { x: (hilf.x + 1) / 2 * B, y: (1 - hilf.y) / 2 * H, z: hilf.z }; }

function karteStellen(k, b){
  var a = sp(b, k.von, k.von + 13), w = sp(b, k.bis - 9, k.bis);
  var sicht = b >= k.von && b <= k.bis;
  if (!sicht){ k.el.style.opacity = 0; return; }
  var s = .82 + .18 * feder(a);
  var mitte = k.art.indexOf("mitte") >= 0;
  k.el.style.opacity = Math.min(1, a * 1.8) * (1 - raus(w));
  k.el.style.transform = (mitte ? "translateY(-50%) " : "") + "translateY(" + (-14 * raus(w)) + "px) scale(" + s + ")";
}

/* ================= Ein Bild ================= */
window.zeichne = function(b){
  /* --- Kamera --- */
  var k = kameraBei(b);
  /* Im Trend folgt die Kamera dem Punkt. */
  var tp = weich(sp(b, TREND_VON, TREND_BIS));
  var am = trend.userData.kurve.getPointAt(Math.max(.0001, tp));
  var folg = Math.min(sp(b, 452, 480), 1 - sp(b, 574, 600));
  if (folg > 0){
    var fz = am.clone().add(v(1.3, .35, 0)), fp = am.clone().add(v(-1.2, 2.2, 12.5));
    k.ziel.lerp(fz, weich(folg)); k.pos.lerp(fp, weich(folg));
  }
  kamera.position.copy(k.pos); kamera.lookAt(k.ziel); kamera.updateMatrixWorld();
  sonne.position.copy(k.ziel).add(v(9, 16, 11)); sonne.target.position.copy(k.ziel);

  /* --- Abend fuer den Schluss --- */
  var nacht = weich(sp(b, 872, 904));
  szene.background.copy(HIMMEL).lerp(NACHT, nacht);
  szene.fog.color.copy(szene.background);
  szene.fog.near = 28 - nacht * 18; szene.fog.far = 80 - nacht * 64;
  bodenMat.color.copy(BODEN).lerp(BODEN_N, nacht);
  himmelLicht.intensity = 1.55 - nacht * 1.0;
  goldLicht.intensity = nacht * 40;
  muenze2.userData.flaechen.forEach(function(m){ m.emissiveIntensity = nacht * .35; });

  /* --- Szene 1 --- */
  muenze1.rotation.y = b * .045 + Math.sin(b * .05) * .2;
  muenze1.position.y = 1.55 + Math.sin(b * .08) * .07;
  [platt1].forEach(function(p){
    var t = (b % 45) / 45, w = p.userData.welle;
    w.scale.setScalar(1 + t * 1.25); w.material.opacity = (1 - t) * .55;
  });

  /* --- Szene 2 und 4: Kerzen wachsen --- */
  wachsen(kerzen1, b, 128, 5);
  wachsen(kerzen2, b, 440, 3);
  /* die erklaerte Kerze leuchtet kurz auf, die anderen treten zurueck */
  var fokus = Math.min(sp(b, 212, 228), 1 - sp(b, 272, 290));
  k5.scale.x = k5.scale.z = 1 + fokus * .12;

  /* --- Szene 3 --- */
  kaeufer.forEach(function(f, i){
    var start = i < 6 ? 300 + i * 3 : 340 + (i - 6) * 3.5;
    var t = feder(sp(b, start, start + 12)); f.visible = t > 0; f.scale.setScalar(Math.max(.001, t));
    f.position.y = Math.max(0, Math.sin((b + i * 7) * .25)) * .06 * (b > 356 ? 1 : 0);
  });
  verkaeufer.forEach(function(f, i){
    var t = feder(sp(b, 302 + i * 3, 314 + i * 3)); f.visible = t > 0; f.scale.setScalar(Math.max(.001, t));
  });
  var nachfrage = weich(sp(b, 344, 400));
  preisPunkt.position.set(40, 1.6 + nachfrage * 2.6, -.2 + .25);
  preisPunkt.visible = b > 296 && b < 440;
  pulsiere(preisPunkt, b);

  /* --- Szene 4: Trendlinie --- */
  zeichneRoute(trend, tp);
  trendPunkt.position.copy(am); trendPunkt.visible = b > TREND_VON && b < 600;
  pulsiere(trendPunkt, b);

  /* --- Szene 5 --- */
  var aL = feder(sp(b, 618, 640)), aS = feder(sp(b, 668, 690));
  pLong.position.set(80.9, -2.6 + aL * 3.9 + Math.sin(b * .09) * .08 * aL, 0);
  pShort.position.set(83.1, 8.4 - aS * 5.4 - Math.sin(b * .09) * .08 * aS, 0);
  pLong.visible = aL > 0; pShort.visible = aS > 0;
  pLong.rotation.y = (1 - aL) * 1.5 + Math.sin(b * .03) * .15;
  pShort.rotation.y = -(1 - aS) * 1.5 - Math.sin(b * .03) * .15;

  /* --- Szene 6 --- */
  var rp = weich(sp(b, 776, 822));
  zeichneRoute(risikoPfad, rp);
  risikoPunkt.position.copy(risikoPfad.userData.kurve.getPointAt(Math.max(.0001, rp)));
  risikoPunkt.visible = b > 772 && b < 890;
  pulsiere(risikoPunkt, b);
  var treffer = b >= 822 ? Math.max(0, 1 - (b - 822) / 22) : 0;
  slZone.material.opacity = .26 + treffer * .5;
  risikoPunkt.userData.kern.material.color.set(b >= 822 ? ROT : BLAU);
  risikoPunkt.userData.kern.material.emissive.set(b >= 822 ? ROT : BLAU);
  blitz.style.opacity = treffer * .16;
  var zonen = sp(b, 760, 776);
  tpZone.visible = slZone.visible = einstieg.visible = zonen > 0;
  tpZone.scale.x = slZone.scale.x = einstieg.scale.x = Math.max(.001, raus(zonen));

  /* --- Schluss --- */
  muenze2.rotation.y = Math.PI * (1 - raus(sp(b, 890, 930))) * 2 + Math.sin(b * .04) * .12;
  muenze2.position.y = 1.75 + Math.sin(b * .07) * .05;
  var sa = raus(sp(b, 912, 936));
  schluss.style.opacity = sa; schluss.style.transform = "translateY(" + (20 * (1 - sa)) + "px)";

  /* --- Karten und Schildchen --- */
  KARTEN.forEach(function(kk){ karteStellen(kk, b); });
  TAGS.forEach(function(t){
    var sicht = b >= t.von && b <= t.bis;
    if (!sicht){ t.el.style.opacity = 0; return; }
    var a = sp(b, t.von, t.von + 10), w = sp(b, t.bis - 8, t.bis);
    var p = bildschirm(t.ort());
    var dx = t.mitte ? -t.el.offsetWidth / 2 : t.links ? -t.el.offsetWidth - 12 : 12;
    t.el.style.opacity = Math.min(1, a * 2) * (1 - w);
    t.el.style.transform = "translate(" + (p.x + dx) + "px," + (p.y - 15 - (t.mitte ? 26 : 0)) + "px) scale(" + (.7 + .3 * feder(a)) + ")";
  });

  renderer.render(szene, kamera);
};

/* ---------- Abspielen im Browser (zum Abfilmen) ---------- */
function einpassen(){
  var s = Math.min(window.innerWidth / B, window.innerHeight / H);
  buehne.style.transform = "scale(" + s + ")";
  if (!window.__aufnahme) renderer.setPixelRatio((window.devicePixelRatio || 1) * Math.max(1, s));
}
window.addEventListener("resize", einpassen); einpassen();
if (!window.__aufnahme){
  var start = performance.now();
  (function lauf(){
    var b = Math.floor((performance.now() - start) / 1000 * FPS) % LAENGE;
    window.zeichne(b); requestAnimationFrame(lauf);
  })();
  document.addEventListener("click", function(){ start = performance.now(); });
} else {
  window.zeichne(0);
}
})();
